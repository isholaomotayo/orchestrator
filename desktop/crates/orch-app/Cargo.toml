[package]
name = "orch-app"
description = "Orchestrator Desktop: the GPUI app"
edition = "2024"
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orchestrator-desktop"
path = "src/main.rs"

[dependencies]
orch-contract = { path = "../orch-contract" }
orch-client = { path = "../orch-client" }
orch-core = { path = "../orch-core" }
serde_json.workspace = true
async-channel.workspace = true
# One GPUI distribution for everything (never mix: their types are distinct).
gpui = { package = "gpui-pre", version = "=0.3.7" }
# `font-kit` is what renders text on macOS; the platform crate defaults it off.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["font-kit"] }

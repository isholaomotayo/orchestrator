name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm run typecheck
      # The served dashboard is built from pipeline/ui/ and committed. This
      # fails if someone edited a source module without rebuilding it.
      - run: pnpm run build:ui -- --check
      - run: pnpm test
        env:
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: commit.gpgsign
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: user.name
          GIT_CONFIG_VALUE_1: 'CI'
          GIT_CONFIG_KEY_2: user.email
          GIT_CONFIG_VALUE_2: 'ci@orchestrator.test'
          GIT_AUTHOR_NAME: 'CI'
          GIT_AUTHOR_EMAIL: 'ci@orchestrator.test'
          GIT_COMMITTER_NAME: 'CI'
          GIT_COMMITTER_EMAIL: 'ci@orchestrator.test'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser

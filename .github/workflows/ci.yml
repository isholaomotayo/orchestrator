name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm run typecheck
      # The served dashboard is built from pipeline/ui/ and committed. This
      # fails if someone edited a source module without rebuilding it.
      - run: pnpm run build:ui -- --check
      - run: pnpm test

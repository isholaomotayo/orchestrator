<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orchestrator</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --sidebar: #fafaf8; --border: #e7e5e2;
    --text: #1c1917; --muted: #78716c; --faint: #a8a29e;
    --surface: #ffffff; --surface-muted: #f7f6f4; --surface-hover: #f0efec;
    --inverse: #1c1917; --on-inverse: #ffffff; --neutral: #d6d3d1;
    --green: #16a34a; --green-bg: #dcfce7; --green-text: #166534;
    --amber-bg: #fef3c7; --amber-text: #92400e;
    --red: #dc2626; --red-bg: #fee2e2; --red-text: #991b1b;
    --purple-bg: #ede9fe; --purple-text: #6d28d9; --purple-border: #ddd6fe;
    --orange: #ea580c; --code-bg: #f5f5f3; --accent-row: #fdf3e7;
    --info-bg: #eff6ff; --info-text: #1e40af; --info-border: #dbeafe;
    --halt-border: #fecaca; --halt-input-border: #fca5a5;
    --pre-bg: #ffffff; --inline-code-bg: #ebe9e6;
    --diff-bg: #ffffff; --diff-add-bg: #f0fdf4; --diff-add-text: #166534;
    --diff-del-bg: #fef2f2; --diff-del-text: #991b1b;
    --diff-hunk-bg: #faf5ff; --diff-hunk-text: #7c3aed;
    --syntax-kw: #7c3aed; --syntax-str: #b45309; --syntax-cmt: #9ca3af; --syntax-typ: #0e7490;
    --terminal-bg: #1c1917; --terminal-text: #e7e5e4; --terminal-muted: #a8a29e;
    --overlay: rgba(28, 25, 23, .35); --shadow: rgba(0, 0, 0, .2);
    --shadow-sm: rgba(0, 0, 0, .06);
    --agent-planner-bg: #ede9fe; --agent-planner-fg: #6d28d9;
    --agent-designer-bg: #dbeafe; --agent-designer-fg: #1d4ed8;
    --agent-coder-bg: #dbeafe; --agent-coder-fg: #1d4ed8;
    --agent-tester-bg: #dcfce7; --agent-tester-fg: #166534;
    --agent-reviewer-bg: #fef3c7; --agent-reviewer-fg: #92400e;
    --agent-handoff-bg: #d1fae5; --agent-handoff-fg: #047857;
    /* Stage-state palette — one source of truth for every state indicator
       (rail rows, run bar, dots, badges, pills). */
    --st-done: #16a34a; --st-done-soft: #dcfce7; --st-done-text: #15803d;
    --st-run: #2563eb;  --st-run-soft: #dbeafe;  --st-run-text: #1d4ed8;
    --st-pending: #d6d3d1; --st-pending-text: #a8a29e;
    --st-skip: #a8a29e;
    --st-fail: #dc2626; --st-fail-soft: #fee2e2; --st-fail-text: #b91c1c;
    --track: #ebe9e6;
    --focus: #2563eb;
    --topbar-h: 52px;
    --sidebar-w: 288px;
    --content-w: 860px;
  }
  [data-theme="dark"] {
    --bg: #1c1917; --panel: #292524; --sidebar: #231f1e; --border: #44403c;
    --text: #fafaf9; --muted: #a8a29e; --faint: #78716c;
    --surface: #292524; --surface-muted: #1c1917; --surface-hover: #3f3a36;
    --inverse: #fafaf9; --on-inverse: #1c1917; --neutral: #57534e;
    --green: #22c55e; --green-bg: #14532d; --green-text: #86efac;
    --amber-bg: #451a03; --amber-text: #fcd34d;
    --red: #ef4444; --red-bg: #450a0a; --red-text: #fca5a5;
    --purple-bg: #2e1065; --purple-text: #c4b5fd; --purple-border: #4c1d95;
    --orange: #f97316; --code-bg: #1c1917; --accent-row: #3b2f1f;
    --info-bg: #1e3a5f; --info-text: #93c5fd; --info-border: #1e40af;
    --halt-border: #7f1d1d; --halt-input-border: #991b1b;
    --pre-bg: #1c1917; --inline-code-bg: #3f3a36;
    --diff-bg: #292524; --diff-add-bg: #14532d; --diff-add-text: #86efac;
    --diff-del-bg: #450a0a; --diff-del-text: #fca5a5;
    --diff-hunk-bg: #2e1065; --diff-hunk-text: #c4b5fd;
    --syntax-kw: #c4b5fd; --syntax-str: #fdba74; --syntax-cmt: #78716c; --syntax-typ: #67e8f9;
    --terminal-bg: #0c0a09; --terminal-text: #e7e5e4; --terminal-muted: #78716c;
    --overlay: rgba(0, 0, 0, .55); --shadow: rgba(0, 0, 0, .45);
    --shadow-sm: rgba(0, 0, 0, .2);
    --agent-planner-bg: #2e1065; --agent-planner-fg: #c4b5fd;
    --agent-designer-bg: #172554; --agent-designer-fg: #93c5fd;
    --agent-coder-bg: #1e3a5f; --agent-coder-fg: #93c5fd;
    --agent-tester-bg: #14532d; --agent-tester-fg: #86efac;
    --agent-reviewer-bg: #451a03; --agent-reviewer-fg: #fcd34d;
    --agent-handoff-bg: #064e3b; --agent-handoff-fg: #6ee7b7;
    --st-done: #22c55e; --st-done-soft: #14532d; --st-done-text: #86efac;
    --st-run: #3b82f6;  --st-run-soft: #1e3a5f;  --st-run-text: #93c5fd;
    --st-pending: #57534e; --st-pending-text: #78716c;
    --st-skip: #57534e;
    --st-fail: #ef4444; --st-fail-soft: #450a0a; --st-fail-text: #fca5a5;
    --track: #332e2b;
    --focus: #60a5fa;
  }
  html { color-scheme: light dark; }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  /* Layout: a fixed shell, with only the panel body scrolling. Several runs
     stream at once, so nothing outside the panel may move under the reader. */
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input, select, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .app { display:grid; height:100vh; grid-template-columns:var(--sidebar-w) 1fr;
    grid-template-rows:var(--topbar-h) 1fr; grid-template-areas:"brand top" "side main"; }

  .topbar { grid-area:1/1/2/3; display:flex; align-items:center; gap:14px;
    padding:0 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:9px; font-weight:650; letter-spacing:-.01em;
    min-width:calc(var(--sidebar-w) - 32px); }
  .appicon { width:24px; height:24px; border-radius:7px; background:var(--inverse); color:var(--on-inverse);
    display:grid; place-items:center; flex-shrink:0; }
  .appicon .ic { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round; }
  .brand .dot { width:8px; height:8px; border-radius:50%; background:var(--st-run); }
  .brand .dot.idle { background:var(--st-pending); }
  .brand .dot.halted { background:var(--st-fail); }
  .spacer { flex:1; }
  .chip { font-size:12px; color:var(--muted); background:var(--surface-muted);
    border:1px solid var(--border); border-radius:999px; padding:2px 10px; white-space:nowrap; }
  .chip.warn { background:var(--amber-bg); color:var(--amber-text); border-color:transparent; }
  .chip.fail { background:var(--red-bg); color:var(--red-text); border-color:transparent; }
  .chip.done { background:var(--green-bg); color:var(--green-text); border-color:transparent; }
  button.chip { font-family:inherit; cursor:pointer; }
  .iconbtn { background:none; border:1px solid var(--border); border-radius:7px;
    padding:4px 9px; cursor:pointer; color:var(--muted); }
  .iconbtn:hover { background:var(--surface-hover); color:var(--text); }

  .sidebar { grid-area:side; background:var(--sidebar); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0; position:relative; }
  .sidebar .scroll { flex:1; overflow-y:auto; padding:10px 10px 20px; }
  .side-section { margin-bottom:16px; }
  .side-title { display:flex; align-items:center; gap:6px; font-size:11px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--faint); padding:4px 6px; }
  .side-title .n { background:var(--surface-muted); border-radius:999px; padding:0 6px; font-size:10px; }
  .side-title.attn .n { background:var(--amber-bg); color:var(--amber-text); }
  .node { display:flex; gap:8px; align-items:flex-start; width:100%; text-align:left;
    background:none; border:0; border-radius:7px; padding:6px 8px; cursor:pointer; color:inherit; }
  .node:hover { background:var(--surface-hover); }
  .node.child { padding-left:22px; }
  .node .dot { width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none; }
  .dot.run { background:var(--st-run); animation:pulse 1.6s ease-in-out infinite; }
  .dot.done { background:var(--st-done); }
  .dot.warn { background:var(--orange); }
  .dot.fail { background:var(--st-fail); }
  .dot.pending { background:var(--st-pending); }
  .dot.skip { background:var(--st-skip); }
  @keyframes pulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion:reduce) { .dot.run { animation:none; } }
  .node .label { flex:1; min-width:0; }
  .node .label b { display:block; font-weight:550; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node .label span { display:block; font-size:11.5px; color:var(--muted); }
  .side-empty { font-size:12px; color:var(--faint); padding:2px 8px 6px; }

  /* Pipeline rail: one compact card per stage, side by side — identity and a
     thin progress track, not a full row each; seven of them must still read
     as one strip, not a page of its own. */
  .rail { display:flex; gap:6px; margin:0 0 16px; flex-wrap:wrap; }
  .rail-row { position:relative; display:flex; flex-direction:column; gap:5px; flex:1 1 108px; min-width:100px;
    text-align:left; padding:7px 10px 8px; border:1px solid var(--border); border-radius:10px;
    background:var(--surface); color:inherit; font:inherit; cursor:pointer; }
  .rail-row:hover { background:var(--surface-hover); }
  .rail-row.selected { background:var(--accent-row); border-color:var(--focus); }
  .rail-top { display:flex; align-items:center; gap:6px; }
  .rail-row .agent-ico { width:18px; height:18px; flex-shrink:0; }
  .rail-nm { font-weight:600; font-size:12px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rail-sub { display:none; } /* kept in the DOM for a11y; the compact card has no room to show it */
  .rail-track { display:block; height:3px; margin-top:1px; background:var(--track);
    border-radius:999px; overflow:hidden; }
  .rail-bar { display:block; height:100%; width:0; border-radius:999px;
    background-color:var(--st-pending); transition:width .45s cubic-bezier(.4,0,.2,1); }
  .rail-row.is-passed .rail-bar { background-color:var(--st-done); width:100%; }
  .rail-row.is-running .rail-bar { background-color:var(--st-run); width:60%; }
  .rail-row.is-failed .rail-bar { background-color:var(--st-fail); width:100%; }
  .rail-row.is-pending .rail-bar { width:0; }
  .rail-row.is-skipped { opacity:.55; }
  .rail-row.is-skipped .rail-track { background:none;
    background-image:repeating-linear-gradient(90deg, var(--st-skip) 0 3px, transparent 3px 6px); }
  .side-foot { border-top:1px solid var(--border); padding:8px 10px; display:flex; gap:6px; flex-wrap:wrap; }
  .resize { position:absolute; top:0; right:-3px; width:6px; height:100%; cursor:col-resize; }

  .main { grid-area:main; display:grid; grid-template-rows:auto 1fr; min-height:0; }
  /* align-items must not be stretch: the buttons would take their height from
     the strip, which takes its height from the buttons, and the whole row
     collapses to its padding. */
  .tabstrip { display:flex; gap:2px; align-items:flex-end; min-height:38px; padding:6px 10px 0;
    background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto; flex:none; }
  .tab { display:flex; align-items:center; gap:7px; min-height:30px; border:1px solid transparent; border-bottom:0;
    background:none; border-radius:8px 8px 0 0; padding:6px 10px; cursor:pointer;
    color:var(--muted); white-space:nowrap; max-width:230px; }
  .tab:hover { background:var(--surface-hover); }
  .tab[aria-selected="true"] { background:var(--bg); color:var(--text);
    border-color:var(--border); font-weight:550; }
  .tab .t { overflow:hidden; text-overflow:ellipsis; }
  .tab .badge { width:7px; height:7px; border-radius:50%; flex:none; }
  .badge.decision { background:var(--orange); }
  .badge.blocked { background:var(--st-fail); }
  .badge.merge { background:var(--purple-text); }
  .badge.done { background:var(--st-done); }
  .tab .x { border:0; background:none; color:var(--faint); cursor:pointer; padding:0 2px; border-radius:4px; }
  .tab .x:hover { background:var(--surface-hover); color:var(--text); }

  /* The panel is the only thing that scrolls. Without min-height:0 the panel
     row sizes to its content, overflows the viewport, and starves the tab
     strip's auto row until the tabs collapse to a few pixels. */
  #panels { min-height:0; display:grid; }
  .panel { min-height:0; overflow-y:auto; padding:22px 26px 60px; }
  .panel[hidden] { display:none !important; }
  .wrap { max-width:var(--content-w); margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em; }
  h2 { font-size:15px; margin:26px 0 10px; }
  h3 { font-size:13px; margin:18px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:11px;
    padding:14px 16px; margin-bottom:12px; }
  .card h4 { margin:0 0 6px; font-size:14px; }
  .card .meta { color:var(--muted); font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn { background:var(--inverse); color:var(--on-inverse); border:0; border-radius:8px;
    padding:7px 14px; cursor:pointer; font-weight:550; }
  .btn:hover { opacity:.9; }
  .btn.ghost { background:none; color:var(--text); border:1px solid var(--border); }
  .btn.danger { background:var(--red); color:#fff; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  textarea, input[type=text], select { width:100%; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  textarea { resize:vertical; min-height:74px; }
  .empty { color:var(--faint); padding:26px 0; text-align:center; }

  /* Overview's six-way run breakdown. */
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px; margin:0 0 20px; }
  .stat-tile { background:var(--panel); border:1px solid var(--border); border-radius:11px; padding:12px 14px;
    cursor:pointer; text-align:left; font:inherit; color:inherit; }
  .stat-tile:hover { background:var(--surface-hover); }
  .stat-tile .n { display:block; font-size:22px; font-weight:650; }
  .stat-tile .lbl { color:var(--muted); font-size:12px; }
  .stat-tile.warn .n { color:var(--amber-text); }
  .stat-tile.fail .n { color:var(--red-text); }

  /* A plain filterable table — Runs, Messages, Reports. */
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  .filters select, .filters input { width:auto; min-width:120px; }
  .tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th { text-align:left; color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.03em; padding:6px 10px; border-bottom:1px solid var(--border); }
  .tbl td { padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
  .tbl tr:hover td { background:var(--surface-hover); }
  .tbl code { font-size:11.5px; }

  .stagebar { display:flex; gap:6px; margin:0 0 14px; flex-wrap:wrap; }
  .stagebtn { display:flex; gap:7px; align-items:center; border:1px solid var(--border);
    background:var(--surface); border-radius:999px; padding:4px 12px 4px 4px; cursor:pointer; font-size:12.5px; }
  .stagebtn[aria-current="step"] { border-color:var(--focus); font-weight:600; background:var(--surface-hover); }
  /* A run view pins the chrome and virtualizes the transcript so a live
     stream cannot rebuild (or even layout) the whole page on every token. */
  .panel.is-run { display:flex; flex-direction:column; overflow:hidden; padding-bottom:16px; }
  .panel.is-run .wrap { flex:1; min-height:0; width:100%; display:flex; flex-direction:column; }
  .feed-shell { flex:1; min-height:140px; overflow-y:auto; margin:0 0 8px; }
  .feed { display:flex; flex-direction:column; gap:9px; }
  .block { background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px; content-visibility:auto; contain-intrinsic-size:auto 60px; }
  .block.sys { color:var(--muted); font-size:12.5px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .block.err { border-color:var(--halt-border); color:var(--red-text); }
  .block.note { border-color:var(--focus); background:var(--surface-hover); }
  .block.card { font-size:12.5px; color:var(--muted); }
  .block .role { display:block; font-size:10.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--faint); margin-bottom:4px; }
  .block .note-state { font-size:11px; color:var(--muted); margin-top:4px; }
  details.diagnostics { margin:14px 0 8px; color:var(--muted); font-size:12.5px; }
  details.diagnostics summary { cursor:pointer; }
  details.diagnostics pre { margin-top:8px; }
  .divider { display:flex; align-items:center; gap:8px; color:var(--faint); font-size:10.5px;
    text-transform:uppercase; letter-spacing:.07em; font-weight:700; margin-top:6px; }
  .divider::after { content:""; flex:1; height:1px; background:var(--border); }

  /* Agent icon: the one visual identity every stage keeps, wherever it
     appears — the stage bar, the header, the sidebar. */
  .agent-ico { display:grid; place-items:center; flex-shrink:0; border-radius:7px; }
  .agent-ico.planner  { background:var(--agent-planner-bg);  color:var(--agent-planner-fg); }
  .agent-ico.designer { background:var(--agent-designer-bg); color:var(--agent-designer-fg); }
  .agent-ico.coder    { background:var(--agent-coder-bg);    color:var(--agent-coder-fg); }
  .agent-ico.tester   { background:var(--agent-tester-bg);   color:var(--agent-tester-fg); }
  .agent-ico.reviewer { background:var(--agent-reviewer-bg); color:var(--agent-reviewer-fg); }
  .agent-ico.handoff, .agent-ico.reporter { background:var(--agent-handoff-bg); color:var(--agent-handoff-fg); }
  .agent-ico .ic { width:60%; height:60%; stroke:currentColor; fill:none; stroke-width:2;
    stroke-linecap:round; stroke-linejoin:round; }
  .stagebtn .agent-ico { width:20px; height:20px; }

  /* Agent header: icon, name, one-line description, and the run's overall
     state as a pill — the card every run tab opens with. */
  .agent-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .agent-header .agent-ico { width:34px; height:34px; }
  .agent-header .nm { font-weight:700; font-size:14.5px; line-height:1.2; }
  .agent-header .desc { font-size:12px; color:var(--muted); margin-top:1px; }
  .agent-header .spacer { flex:1; }
  .pill { font-size:10.5px; font-weight:600; padding:3px 10px 3px 20px; position:relative;
    border-radius:999px; background:var(--surface-hover); color:var(--muted); white-space:nowrap; }
  .pill::before { content:''; position:absolute; left:9px; top:50%; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.5; }
  .pill.running { background:var(--st-run-soft); color:var(--st-run-text); }
  .pill.running::before { opacity:1; animation:pulse 1.4s infinite; }
  .pill.done { background:var(--st-done-soft); color:var(--st-done-text); }
  .pill.halted, .pill.failed { background:var(--st-fail-soft); color:var(--st-fail-text); }
  .pill.stale { background:var(--amber-bg); color:var(--amber-text); }
  .pill.awaiting, .pill.awaiting_chat, .pill.awaiting_plan_approval { background:var(--purple-bg); color:var(--purple-text); }

  /* Artifact card: what a stage produced, set apart from ordinary prose. */
  .sec-label { font-size:10.5px; font-weight:700; letter-spacing:.07em; color:var(--faint);
    text-transform:uppercase; margin:18px 0 6px; }
  .artifact-card { background:var(--code-bg); border:1px solid var(--border); border-radius:10px;
    padding:2px 16px 12px; }
  pre { background:var(--code-bg); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; overflow-x:auto; margin:8px 0; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
  p code, li code, td code { background:var(--inline-code-bg); padding:1px 5px; border-radius:4px; }
  .kw{color:var(--syntax-kw)} .str{color:var(--syntax-str)} .cmt{color:var(--syntax-cmt)} .typ{color:var(--syntax-typ)}
  table { border-collapse:collapse; width:100%; font-size:13px; margin:8px 0; display:block; overflow-x:auto; }
  th,td { border:1px solid var(--border); padding:6px 9px; text-align:left; vertical-align:top; }
  th { background:var(--surface-muted); }
  .diff-file { border:1px solid var(--border); border-radius:9px; margin-bottom:8px; overflow:hidden; }
  .diff-file summary { padding:8px 11px; cursor:pointer; background:var(--surface-muted); font-size:13px; }

<script type="module">

// ===== md.mjs =====
// Markdown, code and diff rendering for the dashboard.
//
// Lifted from the single-file dashboard so it can be unit-tested without a
// browser. The escaping discipline is the point: every input here is text an
// agent wrote after reading a repository that may contain anything, so content
// is escaped first and decorated afterwards — never the other way round.

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function hl(code) {
  return esc(code)
    .replace(/(\/\/[^\n]*)/g, '<span class="cmt">$1</span>')
    .replace(/('[^']*'|"[^"]*"|`[^`]*`)/g, '<span class="str">$1</span>')
    .replace(/\b(export|import|from|function|const|let|var|return|async|await|if|else|throw|new|class|interface|type|extends)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(string|number|boolean|void|Promise|Record|Array)\b/g, '<span class="typ">$1</span>');
}

function renderMd(md) {
  const blocks = md.split(/```/);
  let html = '';
  blocks.forEach((block, i) => {
    if (i % 2 === 1) {
      const nl = block.indexOf('\n');
      html += '<pre><code>' + hl(nl >= 0 ? block.slice(nl + 1) : block) + '</code></pre>';
      return;
    }
    const lines = block.split('\n');
    let inList = false, para = [];
    const flush = () => { if (para.length) { html += '<p>' + para.join(' ') + '</p>'; para = []; } };
    const inline = (s) => esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*(?!\s)([^*]+)\*/g, '<em>$1</em>');
    const isTableRow = (l) => /\|/.test(l) && /^\s*\|?.*\|.*$/.test(l);
    const isTableSep = (l) => /^\s*\|?(\s*:?-{2,}:?\s*\|)+\s*:?-{2,}:?\s*\|?\s*$/.test(l) || /^\s*\|(\s*:?-{2,}:?\s*\|)+\s*$/.test(l);
    const splitRow = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      if (isTableRow(line) && li + 1 < lines.length && isTableSep(lines[li + 1])) {
        flush(); if (inList) { html += '</ul>'; inList = false; }
        const headers = splitRow(line);
        let body = '';
        li += 2;
        while (li < lines.length && isTableRow(lines[li]) && !isTableSep(lines[li])) {
          const cells = splitRow(lines[li]);
          body += '<tr>' + headers.map((_, ci) => `<td>${inline(cells[ci] ?? '')}</td>`).join('') + '</tr>';
          li++;
        }
        li--;
        html += '<table><thead><tr>' + headers.map((hd) => `<th>${inline(hd)}</th>`).join('') + '</tr></thead><tbody>' + body + '</tbody></table>';
        continue;
      }
      const h = line.match(/^(#{1,4})\s+(.*)/);
      if (h) { flush(); if (inList) { html += '</ul>'; inList = false; } html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
      if (/^\s*[-*]\s+/.test(line)) { flush(); if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(line.replace(/^\s*[-*]\s+/, '')) + '</li>'; continue; }
      if (inList && line.trim() === '') { html += '</ul>'; inList = false; continue; }
      if (/^\s*---+\s*$/.test(line)) { flush(); html += '<hr>'; continue; }
      if (line.trim() === '') { flush(); continue; }
      para.push(inline(line));
    }
    flush(); if (inList) html += '</ul>';
  });
  return html;
}


// ===== diff.mjs =====
// Splitting and rendering unified diffs.
//
// A run's diff can span several repositories and hundreds of files, so it is
// split per file and rendered collapsed unless it is small enough to read at a
// glance.

function diffLineHtml(line) {
  let cls = '';
  if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('diff ') || line.startsWith('index ')) cls = 'meta';
  else if (line.startsWith('@@')) cls = 'hunk';
  else if (line.startsWith('+')) cls = 'add';
  else if (line.startsWith('-')) cls = 'del';
  return `<div class="dl ${cls}">${esc(line) || ' '}</div>`;
}

// Split a patch into per-file sections. A flat render of a large diff builds one
// enormous DOM and gives no way to find the file you care about; collapsed
// sections with +/- counts make a big review navigable.

function splitDiffFiles(patch) {
  const files = [];
  let current = null;
  let repo = null;
  for (const line of patch.split('\n')) {
    // A multi-repo diff carries one "## repo `<label>` — diff vs <ref>" heading
    // per repository. Break the card stream there, or the heading disappears
    // into the tail of the previous file and two repos' identically-named files
    // render as indistinguishable cards.
    const section = line.match(/^##\s+repo\s+`(.+?)`/);
    if (section) {
      repo = section[1] === '.' ? null : section[1];
      current = { name: null, lines: [line], add: 0, del: 0 };
      files.push(current);
      continue;
    }
    const header = line.match(/^diff --git a\/(.+?) b\/(.+)$/);
    if (header) {
      current = { name: repo ? repo + '/' + header[2] : header[2], lines: [line], add: 0, del: 0 };
      files.push(current);
      continue;
    }
    if (!current) {
      // Preamble (e.g. the "# diff vs <ref>" banner the orchestrator writes).
      current = { name: null, lines: [], add: 0, del: 0 };
      files.push(current);
    }
    current.lines.push(line);
    if (line.startsWith('+') && !line.startsWith('+++')) current.add++;
    else if (line.startsWith('-') && !line.startsWith('---')) current.del++;
  }
  return files.filter((f) => f.lines.some((l) => l.trim()));
}

const DIFF_AUTO_OPEN_LINES = 400; // keep small diffs expanded, collapse big ones
function renderDiff(patch) {
  const files = splitDiffFiles(patch);
  const named = files.filter((f) => f.name);
  if (!named.length) {
    // No git file headers (e.g. the "no changes detected" note) — render as-is.
    return `<div class="diff-body">${patch.split('\n').map(diffLineHtml).join('')}</div>`;
  }
  const total = named.reduce((n, f) => n + f.lines.length, 0);
  const openByDefault = total <= DIFF_AUTO_OPEN_LINES;
  return files.map((f) => {
    const body = `<div class="diff-body">${f.lines.map(diffLineHtml).join('')}</div>`;
    if (!f.name) return body;
    return `<details class="diff-file"${openByDefault ? ' open' : ''}>
      <summary>
        <span class="fname">${esc(f.name)}</span>
        <span class="diff-stat"><span class="plus">+${f.add}</span> <span class="minus">-${f.del}</span></span>
      </summary>${body}</details>`;
  }).join('');
}


// ===== tabs.mjs =====
// The tab store.
//
// The old dashboard held one project, one run and one stage in module globals.
// Watching several workers at once means each open thing needs its own state —
// its own stage selection, its own scroll position, its own filter — so that
// switching tabs shows you exactly what you left, and a background run
// finishing does not move the view you are reading.
//
// Pure and DOM-free: the store decides what is open and what deserves
// attention; rendering is somebody else's job.

const MAX_TABS = 12;

// Which kinds may be opened more than once (one per subject).
const SUBJECT_KINDS = new Set(['run', 'feature', 'review', 'report', 'diff']);

function tabId(spec) {
  return SUBJECT_KINDS.has(spec.kind)
    ? `${spec.kind}:${spec.subject}${spec.file ? `/${spec.file}` : ''}`
    : spec.kind;
}

function createTabStore({ max = MAX_TABS } = {}) {
  /** @type {Array<object>} */
  let tabs = [];
  let activeId = null;

  function open(spec) {
    const id = tabId(spec);
    const existing = tabs.find((t) => t.id === id);
    if (existing) {
      Object.assign(existing, { ...spec, id, openedAt: existing.openedAt });
      activeId = id;
      existing.attention = null;
      existing.unread = false;
      return existing;
    }
    const tab = {
      id,
      kind: spec.kind,
      subject: spec.subject ?? null,
      title: spec.title ?? spec.kind,
      file: spec.file ?? null,
      pinned: !!spec.pinned,
      // Per-tab view state, so tabs never share a stage selection or a filter.
      stage: spec.stage ?? null,
      filter: '',
      showAll: false,
      scrollTop: 0,
      unread: false,
      attention: null,
      lastSeenSeq: 0,
      openedAt: Date.now(),
    };
    tabs.push(tab);
    activeId = id;
    evict();
    return tab;
  }

  function close(id) {
    const tab = tabs.find((t) => t.id === id);
    if (!tab || tab.pinned) return false;
    const index = tabs.indexOf(tab);
    tabs = tabs.filter((t) => t.id !== id);
    if (activeId === id) {
      const next = tabs[index] || tabs[index - 1] || tabs[0];
      activeId = next ? next.id : null;
    }
    return true;
  }

  function activate(id) {
    const tab = tabs.find((t) => t.id === id);
    if (!tab) return null;
    activeId = id;
    // Looking at something clears its claim on your attention.
    tab.unread = false;
    tab.attention = null;
    return tab;
  }

  function evict() {
    // Never evict what is pinned or being looked at; drop the least recently
    // opened of the rest, so a burst of new runs cannot bury the tab you are in.
    while (tabs.length > max) {
      const victim = tabs
        .filter((t) => !t.pinned && t.id !== activeId)
        .sort((a, b) => a.openedAt - b.openedAt)[0];
      if (!victim) break;
      tabs = tabs.filter((t) => t !== victim);
    }
  }

  // Priority order matters: a decision waiting on a person outranks a failure,
  // which outranks a finished run.
  const RANK = { decision: 4, blocked: 3, merge: 2, done: 1 };

  function markAttention(subject, level, { seq = null } = {}) {
    let marked = false;
    for (const tab of tabs) {
      if (tab.subject !== subject) continue;
      if (seq != null && seq <= tab.lastSeenSeq) continue;
      if (tab.id === activeId) { tab.lastSeenSeq = seq ?? tab.lastSeenSeq; continue; }
      if (!tab.attention || (RANK[level] ?? 0) > (RANK[tab.attention] ?? 0)) tab.attention = level;
      tab.unread = true;
      if (seq != null) tab.lastSeenSeq = seq;
      marked = true;
    }
    return marked;
  }

  function pin(id, pinned = true) {
    const tab = tabs.find((t) => t.id === id);
    if (tab) tab.pinned = pinned;
    return tab ?? null;
  }

  function move(delta) {
    if (!tabs.length) return null;
    const index = tabs.findIndex((t) => t.id === activeId);
    const next = tabs[(((index === -1 ? 0 : index) + delta) % tabs.length + tabs.length) % tabs.length];
    return activate(next.id);
  }

  /** Serialise to a hash fragment so a reload restores the same workspace. */
  function serialize() {
    const parts = tabs.map((t) => `${t.id}${t.stage ? `.${t.stage}` : ''}`);
    const active = tabs.findIndex((t) => t.id === activeId);
    const pins = tabs.filter((t) => t.pinned).map((t) => t.id);
    return `tabs=${encodeURIComponent(parts.join(','))}&active=${active}${pins.length ? `&pin=${encodeURIComponent(pins.join(','))}` : ''}`;
  }

  function restore(hash, { titleFor = (spec) => spec.subject || spec.kind } = {}) {
    const params = new URLSearchParams(String(hash || '').replace(/^#/, ''));
    const raw = params.get('tabs');
    if (!raw) return [];
    const pins = new Set((params.get('pin') || '').split(',').filter(Boolean));
    tabs = [];
    activeId = null;
    for (const part of raw.split(',').filter(Boolean)) {
      const [idPart, stage] = part.split('.');
      const [kind, ...rest] = idPart.split(':');
      const subject = rest.join(':') || null;
      const spec = { kind, subject, stage: stage || null, pinned: pins.has(idPart) };
      open({ ...spec, title: titleFor(spec) });
    }
    const activeIndex = Number(params.get('active'));
    activeId = tabs[Number.isInteger(activeIndex) && activeIndex >= 0 ? activeIndex : 0]?.id ?? null;
    return tabs;
  }

  return {
    open, close, activate, pin, move, markAttention, serialize, restore,
    list: () => tabs.slice(),
    active: () => tabs.find((t) => t.id === activeId) ?? null,
    activeId: () => activeId,
    get: (id) => tabs.find((t) => t.id === id) ?? null,
    attentionCount: () => tabs.filter((t) => t.attention).length,
  };
}


// ===== pool-tree.mjs =====
// Turning a pool snapshot into the sidebar's navigation tree.
//
// The sidebar answers four questions in the order an operator actually asks
// them: what needs me, what is happening, what just landed, what is next. Runs
// hang under the feature they belong to, because "which feature is this worker
// building?" is the only context that makes a run id meaningful.

const STATE_DOT = {
  busy: 'run',
  stale: 'warn',
  awaiting: 'warn',
  dead: 'fail',
  unknown: 'pending',
  idle: 'done',
};

const FEATURE_DOT = {
  accepted: 'done',
  landed: 'done',
  merging: 'run',
  merge_approved: 'run',
  awaiting_merge_approval: 'warn',
  reviewing: 'run',
  integrating: 'run',
  executing: 'run',
  planning: 'run',
  awaiting_plan_approval: 'warn',
  queued: 'pending',
  held: 'warn',
  skipped: 'skip',
  failed: 'fail',
};

// What the operator should call each state. Internal vocabulary ("integrating",
// "executing") means nothing to someone who did not write the state machine.
const FEATURE_LABEL = {
  queued: 'queued',
  planning: 'planning',
  awaiting_plan_approval: 'needs your approval',
  executing: 'building',
  integrating: 'combining work',
  reviewing: 'in review',
  awaiting_merge_approval: 'ready to merge',
  merge_approved: 'merging',
  merging: 'merging',
  accepted: 'accepted onto roadmap branch',
  landed: 'landed',
  failed: 'failed',
  held: 'on hold',
  skipped: 'skipped',
};

function featureLabel(status) {
  return FEATURE_LABEL[status] ?? status;
}

function attentionLevel(item) {
  if (item.kind === 'merge-approval') return 'merge';
  if (['blocked', 'merge-conflict', 'feature-failed', 'halted', 'dead', 'review-failed'].includes(item.kind)) return 'blocked';
  return 'decision';
}

/**
 * Build the sidebar model.
 * @param {object|null} snapshot a pool snapshot, or null in single-run mode
 */
function buildTree(snapshot) {
  if (!snapshot) return { enabled: false, sections: [] };

  const runsByFeature = new Map();
  for (const run of snapshot.inProgress || []) {
    const key = run.featureId ?? '_';
    if (!runsByFeature.has(key)) runsByFeature.set(key, []);
    runsByFeature.get(key).push({
      id: run.runId,
      kind: 'run',
      label: run.ticketId || run.kind || run.runId.slice(-8),
      sub: [run.stage, run.cycle > 1 ? `cycle ${run.cycle}` : null].filter(Boolean).join(' · '),
      dot: STATE_DOT[run.state] ?? 'pending',
      state: run.state,
      warn: run.state === 'stale' ? 'quiet for a long time'
        : run.state === 'dead' ? 'the worker process is gone' : null,
      featureId: run.featureId ?? null,
    });
  }

  const features = snapshot.roadmap?.features ?? [];
  const inProgress = features
    .filter((f) => !['queued', 'accepted', 'landed', 'skipped'].includes(f.status))
    .map((f) => ({
      id: f.id,
      kind: 'feature',
      label: `${f.id}: ${f.title}`,
      sub: featureLabel(f.status),
      dot: FEATURE_DOT[f.status] ?? 'pending',
      status: f.status,
      children: runsByFeature.get(f.id) ?? [],
    }));

  // Runs whose feature is not in the roadmap (an ad-hoc or orphaned run) must
  // still be reachable, or a worker could be running with nowhere to see it.
  const orphanRuns = [...runsByFeature.entries()]
    .filter(([key]) => key === '_' || !features.some((f) => f.id === key))
    .flatMap(([, runs]) => runs);
  if (orphanRuns.length) {
    inProgress.push({ id: '_other', kind: 'feature', label: 'Other runs', sub: '', dot: 'pending', children: orphanRuns });
  }

  return {
    enabled: true,
    paused: !!snapshot.supervisor?.paused,
    supervisorAlive: !!snapshot.supervisor?.alive,
    sections: [
      {
        key: 'needsDecision',
        title: 'Needs your decision',
        count: (snapshot.needsDecision || []).length,
        emptyText: 'Nothing right now.',
        items: (snapshot.needsDecision || []).map((d) => ({
          id: d.decisionId ?? `${d.kind}:${d.featureId ?? d.runId ?? ''}`,
          kind: 'decision',
          label: d.question,
          sub: [d.featureId, d.runId].filter(Boolean).join(' · '),
          dot: attentionLevel(d) === 'blocked' ? 'fail' : 'warn',
          decisionId: d.decisionId ?? null,
          featureId: d.featureId ?? null,
          runId: d.runId ?? null,
          level: attentionLevel(d),
        })),
      },
      {
        key: 'inProgress',
        title: 'In progress',
        count: inProgress.length,
        emptyText: 'Nothing is running.',
        items: inProgress,
      },
      {
        key: 'recentlyLanded',
        title: 'Recently landed',
        count: (snapshot.recentlyLanded || []).length,
        emptyText: 'Nothing yet.',
        items: (snapshot.recentlyLanded || []).map((f) => ({
          id: f.featureId,
          kind: 'feature',
          label: `${f.featureId}: ${f.title}`,
          sub: f.status === 'accepted' ? `accepted · ${f.deliveryBranch || 'roadmap branch'}` : f.pr?.url ? 'merged · pull request' : 'landed',
          dot: 'done',
          reportRel: f.reportRel ?? null,
          pr: f.pr ?? null,
        })),
      },
      {
        key: 'upNext',
        title: 'Up next',
        count: (snapshot.upNext || []).length,
        emptyText: 'Nothing queued.',
        items: (snapshot.upNext || []).map((f) => ({
          id: f.featureId,
          kind: 'feature',
          label: `${f.featureId}: ${f.title}`,
          sub: f.blockedBy?.length ? `waiting on ${f.blockedBy.join(', ')}` : 'ready',
          dot: 'pending',
        })),
      },
    ],
  };
}

/** Which runs deserve a tab badge, and at what level. */
function attentionByRun(snapshot) {
  const out = new Map();
  for (const item of snapshot?.needsDecision || []) {
    if (item.runId) out.set(item.runId, attentionLevel(item));
  }
  for (const run of snapshot?.inProgress || []) {
    if (run.state === 'dead' || run.state === 'stale') out.set(run.runId, 'blocked');
  }
  return out;
}


// ===== api.mjs =====
// Talking to the dashboard server.
//
// Every call is scoped to a project, because one dashboard serves every repo on
// the machine. Errors are returned rather than thrown: a failed poll should
// leave the last good view on screen with a note, not blank the page.

function createApi(projectRef) {
  const q = (params = {}) => {
    const search = new URLSearchParams({ project: projectRef(), ...params });
    for (const [k, v] of [...search]) if (v === undefined || v === null || v === '') search.delete(k);
    return search.toString();
  };

  async function get(path, params) {
    const res = await fetch(`${path}?${q(params)}`, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error(`${path} failed (${res.status})`);
    return res.json();
  }

  async function post(path, body = {}) {
    const res = await fetch(`${path}?${q()}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `${path} failed (${res.status})`);
    return data;
  }

  return {
    projects: () => get('/api/projects'),
    state: (run) => get('/api/state', run ? { run } : {}),
    runs: () => get('/api/runs'),
    pool: () => get('/api/pool'),
    decisions: (status) => get('/api/decisions', status ? { status } : {}),
    bridge: () => get('/api/bridge'),
    artifact: (name, run) => get('/api/artifact', { name, ...(run ? { run } : {}) }),
    log: (stage, run, params = {}) => get('/api/log', { stage, ...(run ? { run } : {}), ...params }),
    reportUrl: (params) => `/api/report?${q(params)}`,

    answerDecision: (decisionId, answer) => post('/api/decisions/answer', { decisionId, answer }),

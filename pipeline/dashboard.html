<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orchestrator</title>
<style>
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --sidebar: #fafaf8; --border: #e7e5e2;
    --text: #1c1917; --muted: #78716c; --faint: #a8a29e;
    --surface: #ffffff; --surface-muted: #f7f6f4; --surface-hover: #f0efec;
    --inverse: #1c1917; --on-inverse: #ffffff; --neutral: #d6d3d1;
    --green: #16a34a; --green-bg: #dcfce7; --green-text: #166534;
    --amber-bg: #fef3c7; --amber-text: #92400e;
    --red: #dc2626; --red-bg: #fee2e2; --red-text: #991b1b;
    --purple-bg: #ede9fe; --purple-text: #6d28d9; --purple-border: #ddd6fe;
    --orange: #ea580c; --code-bg: #f5f5f3; --accent-row: #fdf3e7;
    --info-bg: #eff6ff; --info-text: #1e40af; --info-border: #dbeafe;
    --halt-border: #fecaca; --halt-input-border: #fca5a5;
    --pre-bg: #ffffff; --inline-code-bg: #ebe9e6;
    --diff-bg: #ffffff; --diff-add-bg: #f0fdf4; --diff-add-text: #166534;
    --diff-del-bg: #fef2f2; --diff-del-text: #991b1b;
    --diff-hunk-bg: #faf5ff; --diff-hunk-text: #7c3aed;
    --syntax-kw: #7c3aed; --syntax-str: #b45309; --syntax-cmt: #9ca3af; --syntax-typ: #0e7490;
    --terminal-bg: #1c1917; --terminal-text: #e7e5e4; --terminal-muted: #a8a29e;
    --overlay: rgba(28, 25, 23, .35); --shadow: rgba(0, 0, 0, .2);
    --shadow-sm: rgba(0, 0, 0, .06);
    --agent-planner-bg: #ede9fe; --agent-planner-fg: #6d28d9;
    --agent-designer-bg: #dbeafe; --agent-designer-fg: #1d4ed8;
    --agent-coder-bg: #dbeafe; --agent-coder-fg: #1d4ed8;
    --agent-tester-bg: #dcfce7; --agent-tester-fg: #166534;
    --agent-reviewer-bg: #fef3c7; --agent-reviewer-fg: #92400e;
    --agent-handoff-bg: #d1fae5; --agent-handoff-fg: #047857;
    /* Stage-state palette — one source of truth for every state indicator
       (rail rows, run bar, dots, badges, pills). */
    --st-done: #16a34a; --st-done-soft: #dcfce7; --st-done-text: #15803d;
    --st-run: #2563eb;  --st-run-soft: #dbeafe;  --st-run-text: #1d4ed8;
    --st-pending: #d6d3d1; --st-pending-text: #a8a29e;
    --st-skip: #a8a29e;
    --st-fail: #dc2626; --st-fail-soft: #fee2e2; --st-fail-text: #b91c1c;
    --track: #ebe9e6;
    --focus: #2563eb;
    --topbar-h: 52px;
    --sidebar-w: 288px;
    --content-w: 860px;
  }
  [data-theme="dark"] {
    --bg: #1c1917; --panel: #292524; --sidebar: #231f1e; --border: #44403c;
    --text: #fafaf9; --muted: #a8a29e; --faint: #78716c;
    --surface: #292524; --surface-muted: #1c1917; --surface-hover: #3f3a36;
    --inverse: #fafaf9; --on-inverse: #1c1917; --neutral: #57534e;
    --green: #22c55e; --green-bg: #14532d; --green-text: #86efac;
    --amber-bg: #451a03; --amber-text: #fcd34d;
    --red: #ef4444; --red-bg: #450a0a; --red-text: #fca5a5;
    --purple-bg: #2e1065; --purple-text: #c4b5fd; --purple-border: #4c1d95;
    --orange: #f97316; --code-bg: #1c1917; --accent-row: #3b2f1f;
    --info-bg: #1e3a5f; --info-text: #93c5fd; --info-border: #1e40af;
    --halt-border: #7f1d1d; --halt-input-border: #991b1b;
    --pre-bg: #1c1917; --inline-code-bg: #3f3a36;
    --diff-bg: #292524; --diff-add-bg: #14532d; --diff-add-text: #86efac;
    --diff-del-bg: #450a0a; --diff-del-text: #fca5a5;
    --diff-hunk-bg: #2e1065; --diff-hunk-text: #c4b5fd;
    --syntax-kw: #c4b5fd; --syntax-str: #fdba74; --syntax-cmt: #78716c; --syntax-typ: #67e8f9;
    --terminal-bg: #0c0a09; --terminal-text: #e7e5e4; --terminal-muted: #78716c;
    --overlay: rgba(0, 0, 0, .55); --shadow: rgba(0, 0, 0, .45);
    --shadow-sm: rgba(0, 0, 0, .2);
    --agent-planner-bg: #2e1065; --agent-planner-fg: #c4b5fd;
    --agent-designer-bg: #172554; --agent-designer-fg: #93c5fd;
    --agent-coder-bg: #1e3a5f; --agent-coder-fg: #93c5fd;
    --agent-tester-bg: #14532d; --agent-tester-fg: #86efac;
    --agent-reviewer-bg: #451a03; --agent-reviewer-fg: #fcd34d;
    --agent-handoff-bg: #064e3b; --agent-handoff-fg: #6ee7b7;
    --st-done: #22c55e; --st-done-soft: #14532d; --st-done-text: #86efac;
    --st-run: #3b82f6;  --st-run-soft: #1e3a5f;  --st-run-text: #93c5fd;
    --st-pending: #57534e; --st-pending-text: #78716c;
    --st-skip: #57534e;
    --st-fail: #ef4444; --st-fail-soft: #450a0a; --st-fail-text: #fca5a5;
    --track: #332e2b;
    --focus: #60a5fa;
  }
  html { color-scheme: light dark; }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  /* Layout: a fixed shell, with only the panel body scrolling. Several runs
     stream at once, so nothing outside the panel may move under the reader. */
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button, input, select, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .app { display:grid; height:100vh; grid-template-columns:var(--sidebar-w) 1fr;
    grid-template-rows:var(--topbar-h) 1fr; grid-template-areas:"brand top" "side main"; }

  .topbar { grid-area:1/1/2/3; display:flex; align-items:center; gap:14px;
    padding:0 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:8px; font-weight:650; letter-spacing:-.01em;
    min-width:calc(var(--sidebar-w) - 32px); }
  .brand .dot { width:9px; height:9px; border-radius:50%; background:var(--st-run); }
  .brand .dot.idle { background:var(--st-pending); }
  .brand .dot.halted { background:var(--st-fail); }
  .spacer { flex:1; }
  .chip { font-size:12px; color:var(--muted); background:var(--surface-muted);
    border:1px solid var(--border); border-radius:999px; padding:2px 10px; white-space:nowrap; }
  .chip.warn { background:var(--amber-bg); color:var(--amber-text); border-color:transparent; }
  .chip.fail { background:var(--red-bg); color:var(--red-text); border-color:transparent; }
  .chip.done { background:var(--green-bg); color:var(--green-text); border-color:transparent; }
  .iconbtn { background:none; border:1px solid var(--border); border-radius:7px;
    padding:4px 9px; cursor:pointer; color:var(--muted); }
  .iconbtn:hover { background:var(--surface-hover); color:var(--text); }

  .sidebar { grid-area:side; background:var(--sidebar); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0; position:relative; }
  .sidebar .scroll { flex:1; overflow-y:auto; padding:10px 10px 20px; }
  .side-section { margin-bottom:16px; }
  .side-title { display:flex; align-items:center; gap:6px; font-size:11px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--faint); padding:4px 6px; }
  .side-title .n { background:var(--surface-muted); border-radius:999px; padding:0 6px; font-size:10px; }
  .side-title.attn .n { background:var(--amber-bg); color:var(--amber-text); }
  .node { display:flex; gap:8px; align-items:flex-start; width:100%; text-align:left;
    background:none; border:0; border-radius:7px; padding:6px 8px; cursor:pointer; color:inherit; }
  .node:hover { background:var(--surface-hover); }
  .node.child { padding-left:22px; }
  .node .dot { width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none; }
  .dot.run { background:var(--st-run); animation:pulse 1.6s ease-in-out infinite; }
  .dot.done { background:var(--st-done); }
  .dot.warn { background:var(--orange); }
  .dot.fail { background:var(--st-fail); }
  .dot.pending { background:var(--st-pending); }
  .dot.skip { background:var(--st-skip); }
  @keyframes pulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion:reduce) { .dot.run { animation:none; } }
  .node .label { flex:1; min-width:0; }
  .node .label b { display:block; font-weight:550; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node .label span { display:block; font-size:11.5px; color:var(--muted); }
  .side-empty { font-size:12px; color:var(--faint); padding:2px 8px 6px; }
  .side-foot { border-top:1px solid var(--border); padding:8px 10px; display:flex; gap:6px; flex-wrap:wrap; }
  .resize { position:absolute; top:0; right:-3px; width:6px; height:100%; cursor:col-resize; }

  .main { grid-area:main; display:grid; grid-template-rows:auto 1fr; min-height:0; }
  /* align-items must not be stretch: the buttons would take their height from
     the strip, which takes its height from the buttons, and the whole row
     collapses to its padding. */
  .tabstrip { display:flex; gap:2px; align-items:flex-end; min-height:38px; padding:6px 10px 0;
    background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto; flex:none; }
  .tab { display:flex; align-items:center; gap:7px; min-height:30px; border:1px solid transparent; border-bottom:0;
    background:none; border-radius:8px 8px 0 0; padding:6px 10px; cursor:pointer;
    color:var(--muted); white-space:nowrap; max-width:230px; }
  .tab:hover { background:var(--surface-hover); }
  .tab[aria-selected="true"] { background:var(--bg); color:var(--text);
    border-color:var(--border); font-weight:550; }
  .tab .t { overflow:hidden; text-overflow:ellipsis; }
  .tab .badge { width:7px; height:7px; border-radius:50%; flex:none; }
  .badge.decision { background:var(--orange); }
  .badge.blocked { background:var(--st-fail); }
  .badge.merge { background:var(--purple-text); }
  .badge.done { background:var(--st-done); }
  .tab .x { border:0; background:none; color:var(--faint); cursor:pointer; padding:0 2px; border-radius:4px; }
  .tab .x:hover { background:var(--surface-hover); color:var(--text); }

  /* The panel is the only thing that scrolls. Without min-height:0 the panel
     row sizes to its content, overflows the viewport, and starves the tab
     strip's auto row until the tabs collapse to a few pixels. */
  #panels { min-height:0; display:grid; }
  .panel { min-height:0; overflow-y:auto; padding:22px 26px 60px; }
  .panel[hidden] { display:none !important; }
  .wrap { max-width:var(--content-w); margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:-.01em; }
  h2 { font-size:15px; margin:26px 0 10px; }
  h3 { font-size:13px; margin:18px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 18px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:11px;
    padding:14px 16px; margin-bottom:12px; }
  .card h4 { margin:0 0 6px; font-size:14px; }
  .card .meta { color:var(--muted); font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn { background:var(--inverse); color:var(--on-inverse); border:0; border-radius:8px;
    padding:7px 14px; cursor:pointer; font-weight:550; }
  .btn:hover { opacity:.9; }
  .btn.ghost { background:none; color:var(--text); border:1px solid var(--border); }
  .btn.danger { background:var(--red); color:#fff; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  textarea, input[type=text], select { width:100%; background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
  textarea { resize:vertical; min-height:74px; }
  .empty { color:var(--faint); padding:26px 0; text-align:center; }

  .stagebar { display:flex; gap:4px; margin:0 0 16px; flex-wrap:wrap; }
  .stagebtn { display:flex; gap:6px; align-items:center; border:1px solid var(--border);
    background:var(--surface); border-radius:999px; padding:4px 11px; cursor:pointer; font-size:12.5px; }
  .stagebtn[aria-current="step"] { border-color:var(--focus); font-weight:600; }
  .feed { display:flex; flex-direction:column; gap:9px; }
  .block { background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px; content-visibility:auto; contain-intrinsic-size:auto 60px; }
  .block.sys { color:var(--muted); font-size:12.5px; }
  .block.err { border-color:var(--halt-border); color:var(--red-text); }
  .divider { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11.5px;
    text-transform:uppercase; letter-spacing:.05em; margin-top:6px; }
  .divider::after { content:""; flex:1; height:1px; background:var(--border); }
  pre { background:var(--code-bg); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; overflow-x:auto; margin:8px 0; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; }
  p code, li code, td code { background:var(--inline-code-bg); padding:1px 5px; border-radius:4px; }
  .kw{color:var(--syntax-kw)} .str{color:var(--syntax-str)} .cmt{color:var(--syntax-cmt)} .typ{color:var(--syntax-typ)}
  table { border-collapse:collapse; width:100%; font-size:13px; margin:8px 0; display:block; overflow-x:auto; }
  th,td { border:1px solid var(--border); padding:6px 9px; text-align:left; vertical-align:top; }
  th { background:var(--surface-muted); }
  .diff-file { border:1px solid var(--border); border-radius:9px; margin-bottom:8px; overflow:hidden; }
  .diff-file summary { padding:8px 11px; cursor:pointer; background:var(--surface-muted); font-size:13px; }
  .diff-file pre { margin:0; border:0; border-radius:0; }
  .dl { white-space:pre; display:block; }
  .dl.add { background:var(--diff-add-bg); color:var(--diff-add-text); }
  .dl.del { background:var(--diff-del-bg); color:var(--diff-del-text); }
  .dl.hunk { background:var(--diff-hunk-bg); color:var(--diff-hunk-text); }
  .dl.meta { color:var(--muted); }
  .banner { border-radius:10px; padding:12px 14px; margin-bottom:14px; font-size:13.5px; }
  .banner.warn { background:var(--amber-bg); color:var(--amber-text); }
  .banner.fail { background:var(--red-bg); color:var(--red-text); }
  .banner.info { background:var(--info-bg); color:var(--info-text); }
  iframe.report { width:100%; height:78vh; border:1px solid var(--border); border-radius:10px; background:#fff; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--inverse); color:var(--on-inverse); padding:9px 16px; border-radius:9px;
    font-size:13px; z-index:50; }
  .toast[hidden] { display:none; }
  kbd { background:var(--surface-muted); border:1px solid var(--border); border-bottom-width:2px;
    border-radius:5px; padding:0 5px; font-size:11px; font-family:inherit; }
</style>
<script>
  // Applied before first paint so the page never flashes the wrong theme.
  (() => {
    try {
      const saved = localStorage.getItem('orchestrator-theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      const w = localStorage.getItem('orchestrator-sidebar-w');
      if (w) document.documentElement.style.setProperty('--sidebar-w', w + 'px');
    } catch {}
  })();
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot" id="live-dot"></span><span>Orchestrator</span></div>
    <select id="project" aria-label="Project"></select>
    <span class="spacer"></span>
    <span class="chip" id="totals" hidden></span>
    <span class="chip" id="pool-state" hidden></span>
    <button class="iconbtn" id="theme" title="Theme">Theme</button>
    <button class="iconbtn" id="help" title="Keyboard shortcuts">?</button>
  </header>

  <aside class="sidebar">
    <div class="scroll" id="side"></div>
    <div class="side-foot" id="side-foot"></div>
    <div class="resize" id="resize" role="separator" aria-orientation="vertical"></div>
  </aside>

  <main class="main">
    <nav class="tabstrip" id="tabs" role="tablist"></nav>
    <div id="panels"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module">

// ===== md.mjs =====
// Markdown, code and diff rendering for the dashboard.
//
// Lifted from the single-file dashboard so it can be unit-tested without a
// browser. The escaping discipline is the point: every input here is text an
// agent wrote after reading a repository that may contain anything, so content
// is escaped first and decorated afterwards — never the other way round.

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function hl(code) {
  return esc(code)
    .replace(/(\/\/[^\n]*)/g, '<span class="cmt">$1</span>')
    .replace(/('[^']*'|"[^"]*"|`[^`]*`)/g, '<span class="str">$1</span>')
    .replace(/\b(export|import|from|function|const|let|var|return|async|await|if|else|throw|new|class|interface|type|extends)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(string|number|boolean|void|Promise|Record|Array)\b/g, '<span class="typ">$1</span>');
}

function renderMd(md) {
  const blocks = md.split(/```/);
  let html = '';
  blocks.forEach((block, i) => {
    if (i % 2 === 1) {
      const nl = block.indexOf('\n');
      html += '<pre><code>' + hl(nl >= 0 ? block.slice(nl + 1) : block) + '</code></pre>';
      return;
    }
    const lines = block.split('\n');
    let inList = false, para = [];
    const flush = () => { if (para.length) { html += '<p>' + para.join(' ') + '</p>'; para = []; } };
    const inline = (s) => esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*(?!\s)([^*]+)\*/g, '<em>$1</em>');
    const isTableRow = (l) => /\|/.test(l) && /^\s*\|?.*\|.*$/.test(l);
    const isTableSep = (l) => /^\s*\|?(\s*:?-{2,}:?\s*\|)+\s*:?-{2,}:?\s*\|?\s*$/.test(l) || /^\s*\|(\s*:?-{2,}:?\s*\|)+\s*$/.test(l);
    const splitRow = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
    for (let li = 0; li < lines.length; li++) {
      const line = lines[li];
      if (isTableRow(line) && li + 1 < lines.length && isTableSep(lines[li + 1])) {
        flush(); if (inList) { html += '</ul>'; inList = false; }
        const headers = splitRow(line);
        let body = '';
        li += 2;
        while (li < lines.length && isTableRow(lines[li]) && !isTableSep(lines[li])) {
          const cells = splitRow(lines[li]);
          body += '<tr>' + headers.map((_, ci) => `<td>${inline(cells[ci] ?? '')}</td>`).join('') + '</tr>';
          li++;
        }
        li--;
        html += '<table><thead><tr>' + headers.map((hd) => `<th>${inline(hd)}</th>`).join('') + '</tr></thead><tbody>' + body + '</tbody></table>';
        continue;
      }
      const h = line.match(/^(#{1,4})\s+(.*)/);
      if (h) { flush(); if (inList) { html += '</ul>'; inList = false; } html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
      if (/^\s*[-*]\s+/.test(line)) { flush(); if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(line.replace(/^\s*[-*]\s+/, '')) + '</li>'; continue; }
      if (inList && line.trim() === '') { html += '</ul>'; inList = false; continue; }
      if (/^\s*---+\s*$/.test(line)) { flush(); html += '<hr>'; continue; }
      if (line.trim() === '') { flush(); continue; }
      para.push(inline(line));
    }
    flush(); if (inList) html += '</ul>';
  });
  return html;
}


// ===== diff.mjs =====
// Splitting and rendering unified diffs.
//
// A run's diff can span several repositories and hundreds of files, so it is
// split per file and rendered collapsed unless it is small enough to read at a
// glance.

function diffLineHtml(line) {
  let cls = '';
  if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('diff ') || line.startsWith('index ')) cls = 'meta';
  else if (line.startsWith('@@')) cls = 'hunk';
  else if (line.startsWith('+')) cls = 'add';
  else if (line.startsWith('-')) cls = 'del';
  return `<div class="dl ${cls}">${esc(line) || ' '}</div>`;
}

// Split a patch into per-file sections. A flat render of a large diff builds one
// enormous DOM and gives no way to find the file you care about; collapsed
// sections with +/- counts make a big review navigable.

function splitDiffFiles(patch) {
  const files = [];
  let current = null;
  let repo = null;
  for (const line of patch.split('\n')) {
    // A multi-repo diff carries one "## repo `<label>` — diff vs <ref>" heading
    // per repository. Break the card stream there, or the heading disappears
    // into the tail of the previous file and two repos' identically-named files
    // render as indistinguishable cards.
    const section = line.match(/^##\s+repo\s+`(.+?)`/);
    if (section) {
      repo = section[1] === '.' ? null : section[1];
      current = { name: null, lines: [line], add: 0, del: 0 };
      files.push(current);
      continue;
    }
    const header = line.match(/^diff --git a\/(.+?) b\/(.+)$/);
    if (header) {
      current = { name: repo ? repo + '/' + header[2] : header[2], lines: [line], add: 0, del: 0 };
      files.push(current);
      continue;
    }
    if (!current) {
      // Preamble (e.g. the "# diff vs <ref>" banner the orchestrator writes).
      current = { name: null, lines: [], add: 0, del: 0 };
      files.push(current);
    }
    current.lines.push(line);
    if (line.startsWith('+') && !line.startsWith('+++')) current.add++;
    else if (line.startsWith('-') && !line.startsWith('---')) current.del++;
  }
  return files.filter((f) => f.lines.some((l) => l.trim()));
}

const DIFF_AUTO_OPEN_LINES = 400; // keep small diffs expanded, collapse big ones
function renderDiff(patch) {
  const files = splitDiffFiles(patch);
  const named = files.filter((f) => f.name);
  if (!named.length) {
    // No git file headers (e.g. the "no changes detected" note) — render as-is.
    return `<div class="diff-body">${patch.split('\n').map(diffLineHtml).join('')}</div>`;
  }
  const total = named.reduce((n, f) => n + f.lines.length, 0);
  const openByDefault = total <= DIFF_AUTO_OPEN_LINES;
  return files.map((f) => {
    const body = `<div class="diff-body">${f.lines.map(diffLineHtml).join('')}</div>`;
    if (!f.name) return body;
    return `<details class="diff-file"${openByDefault ? ' open' : ''}>
      <summary>
        <span class="fname">${esc(f.name)}</span>
        <span class="diff-stat"><span class="plus">+${f.add}</span> <span class="minus">-${f.del}</span></span>
      </summary>${body}</details>`;
  }).join('');
}


// ===== tabs.mjs =====
// The tab store.
//
// The old dashboard held one project, one run and one stage in module globals.
// Watching several workers at once means each open thing needs its own state —
// its own stage selection, its own scroll position, its own filter — so that
// switching tabs shows you exactly what you left, and a background run
// finishing does not move the view you are reading.
//
// Pure and DOM-free: the store decides what is open and what deserves
// attention; rendering is somebody else's job.

const MAX_TABS = 12;

// Which kinds may be opened more than once (one per subject).
const SUBJECT_KINDS = new Set(['run', 'feature', 'review', 'report', 'diff']);

function tabId(spec) {
  return SUBJECT_KINDS.has(spec.kind)
    ? `${spec.kind}:${spec.subject}${spec.file ? `/${spec.file}` : ''}`
    : spec.kind;
}

function createTabStore({ max = MAX_TABS } = {}) {
  /** @type {Array<object>} */
  let tabs = [];
  let activeId = null;

  function open(spec) {
    const id = tabId(spec);
    const existing = tabs.find((t) => t.id === id);
    if (existing) {
      Object.assign(existing, { ...spec, id, openedAt: existing.openedAt });
      activeId = id;
      existing.attention = null;
      existing.unread = false;
      return existing;
    }
    const tab = {
      id,
      kind: spec.kind,
      subject: spec.subject ?? null,
      title: spec.title ?? spec.kind,
      file: spec.file ?? null,
      pinned: !!spec.pinned,
      // Per-tab view state, so tabs never share a stage selection or a filter.
      stage: spec.stage ?? null,
      filter: '',
      showAll: false,
      scrollTop: 0,
      unread: false,
      attention: null,
      lastSeenSeq: 0,
      openedAt: Date.now(),
    };
    tabs.push(tab);
    activeId = id;
    evict();
    return tab;
  }

  function close(id) {
    const tab = tabs.find((t) => t.id === id);
    if (!tab || tab.pinned) return false;
    const index = tabs.indexOf(tab);
    tabs = tabs.filter((t) => t.id !== id);
    if (activeId === id) {
      const next = tabs[index] || tabs[index - 1] || tabs[0];
      activeId = next ? next.id : null;
    }
    return true;
  }

  function activate(id) {
    const tab = tabs.find((t) => t.id === id);
    if (!tab) return null;
    activeId = id;
    // Looking at something clears its claim on your attention.
    tab.unread = false;
    tab.attention = null;
    return tab;
  }

  function evict() {
    // Never evict what is pinned or being looked at; drop the least recently
    // opened of the rest, so a burst of new runs cannot bury the tab you are in.
    while (tabs.length > max) {
      const victim = tabs
        .filter((t) => !t.pinned && t.id !== activeId)
        .sort((a, b) => a.openedAt - b.openedAt)[0];
      if (!victim) break;
      tabs = tabs.filter((t) => t !== victim);
    }
  }

  // Priority order matters: a decision waiting on a person outranks a failure,
  // which outranks a finished run.
  const RANK = { decision: 4, blocked: 3, merge: 2, done: 1 };

  function markAttention(subject, level, { seq = null } = {}) {
    let marked = false;
    for (const tab of tabs) {
      if (tab.subject !== subject) continue;
      if (seq != null && seq <= tab.lastSeenSeq) continue;
      if (tab.id === activeId) { tab.lastSeenSeq = seq ?? tab.lastSeenSeq; continue; }
      if (!tab.attention || (RANK[level] ?? 0) > (RANK[tab.attention] ?? 0)) tab.attention = level;
      tab.unread = true;
      if (seq != null) tab.lastSeenSeq = seq;
      marked = true;
    }
    return marked;
  }

  function pin(id, pinned = true) {
    const tab = tabs.find((t) => t.id === id);
    if (tab) tab.pinned = pinned;
    return tab ?? null;
  }

  function move(delta) {
    if (!tabs.length) return null;
    const index = tabs.findIndex((t) => t.id === activeId);
    const next = tabs[(((index === -1 ? 0 : index) + delta) % tabs.length + tabs.length) % tabs.length];
    return activate(next.id);
  }

  /** Serialise to a hash fragment so a reload restores the same workspace. */
  function serialize() {
    const parts = tabs.map((t) => `${t.id}${t.stage ? `.${t.stage}` : ''}`);
    const active = tabs.findIndex((t) => t.id === activeId);
    const pins = tabs.filter((t) => t.pinned).map((t) => t.id);
    return `tabs=${encodeURIComponent(parts.join(','))}&active=${active}${pins.length ? `&pin=${encodeURIComponent(pins.join(','))}` : ''}`;
  }

  function restore(hash, { titleFor = (spec) => spec.subject || spec.kind } = {}) {
    const params = new URLSearchParams(String(hash || '').replace(/^#/, ''));
    const raw = params.get('tabs');
    if (!raw) return [];
    const pins = new Set((params.get('pin') || '').split(',').filter(Boolean));
    tabs = [];
    activeId = null;
    for (const part of raw.split(',').filter(Boolean)) {
      const [idPart, stage] = part.split('.');
      const [kind, ...rest] = idPart.split(':');
      const subject = rest.join(':') || null;
      const spec = { kind, subject, stage: stage || null, pinned: pins.has(idPart) };
      open({ ...spec, title: titleFor(spec) });
    }
    const activeIndex = Number(params.get('active'));
    activeId = tabs[Number.isInteger(activeIndex) && activeIndex >= 0 ? activeIndex : 0]?.id ?? null;
    return tabs;
  }

  return {
    open, close, activate, pin, move, markAttention, serialize, restore,
    list: () => tabs.slice(),
    active: () => tabs.find((t) => t.id === activeId) ?? null,
    activeId: () => activeId,
    get: (id) => tabs.find((t) => t.id === id) ?? null,
    attentionCount: () => tabs.filter((t) => t.attention).length,
  };
}


// ===== pool-tree.mjs =====
// Turning a pool snapshot into the sidebar's navigation tree.
//
// The sidebar answers four questions in the order an operator actually asks
// them: what needs me, what is happening, what just landed, what is next. Runs
// hang under the feature they belong to, because "which feature is this worker
// building?" is the only context that makes a run id meaningful.

const STATE_DOT = {
  busy: 'run',
  stale: 'warn',
  awaiting: 'warn',
  dead: 'fail',
  unknown: 'pending',
  idle: 'done',
};

const FEATURE_DOT = {
  landed: 'done',
  merging: 'run',
  merge_approved: 'run',
  awaiting_merge_approval: 'warn',
  reviewing: 'run',
  integrating: 'run',
  executing: 'run',
  planning: 'run',
  awaiting_plan_approval: 'warn',
  queued: 'pending',
  held: 'warn',
  skipped: 'skip',
  failed: 'fail',
};

// What the operator should call each state. Internal vocabulary ("integrating",
// "executing") means nothing to someone who did not write the state machine.
const FEATURE_LABEL = {
  queued: 'queued',
  planning: 'planning',
  awaiting_plan_approval: 'needs your approval',
  executing: 'building',
  integrating: 'combining work',
  reviewing: 'in review',
  awaiting_merge_approval: 'ready to merge',
  merge_approved: 'merging',
  merging: 'merging',
  landed: 'landed',
  failed: 'failed',
  held: 'on hold',
  skipped: 'skipped',
};

function featureLabel(status) {
  return FEATURE_LABEL[status] ?? status;
}

function attentionLevel(item) {
  if (item.kind === 'merge-approval') return 'merge';
  if (['blocked', 'merge-conflict', 'feature-failed', 'halted', 'dead', 'review-failed'].includes(item.kind)) return 'blocked';
  return 'decision';
}

/**
 * Build the sidebar model.
 * @param {object|null} snapshot a pool snapshot, or null in single-run mode
 */
function buildTree(snapshot) {
  if (!snapshot) return { enabled: false, sections: [] };

  const runsByFeature = new Map();
  for (const run of snapshot.inProgress || []) {
    const key = run.featureId ?? '_';
    if (!runsByFeature.has(key)) runsByFeature.set(key, []);
    runsByFeature.get(key).push({
      id: run.runId,
      kind: 'run',
      label: run.ticketId || run.kind || run.runId.slice(-8),
      sub: [run.stage, run.cycle > 1 ? `cycle ${run.cycle}` : null].filter(Boolean).join(' · '),
      dot: STATE_DOT[run.state] ?? 'pending',
      state: run.state,
      warn: run.state === 'stale' ? 'quiet for a long time'
        : run.state === 'dead' ? 'the worker process is gone' : null,
      featureId: run.featureId ?? null,
    });
  }

  const features = snapshot.roadmap?.features ?? [];
  const inProgress = features
    .filter((f) => !['queued', 'landed', 'skipped'].includes(f.status))
    .map((f) => ({
      id: f.id,
      kind: 'feature',
      label: `${f.id}: ${f.title}`,
      sub: featureLabel(f.status),
      dot: FEATURE_DOT[f.status] ?? 'pending',
      status: f.status,
      children: runsByFeature.get(f.id) ?? [],
    }));

  // Runs whose feature is not in the roadmap (an ad-hoc or orphaned run) must
  // still be reachable, or a worker could be running with nowhere to see it.
  const orphanRuns = [...runsByFeature.entries()]
    .filter(([key]) => key === '_' || !features.some((f) => f.id === key))
    .flatMap(([, runs]) => runs);
  if (orphanRuns.length) {
    inProgress.push({ id: '_other', kind: 'feature', label: 'Other runs', sub: '', dot: 'pending', children: orphanRuns });
  }

  return {
    enabled: true,
    paused: !!snapshot.supervisor?.paused,
    supervisorAlive: !!snapshot.supervisor?.alive,
    sections: [
      {
        key: 'needsDecision',
        title: 'Needs your decision',
        count: (snapshot.needsDecision || []).length,
        emptyText: 'Nothing right now.',
        items: (snapshot.needsDecision || []).map((d) => ({
          id: d.decisionId ?? `${d.kind}:${d.featureId ?? d.runId ?? ''}`,
          kind: 'decision',
          label: d.question,
          sub: [d.featureId, d.runId].filter(Boolean).join(' · '),
          dot: attentionLevel(d) === 'blocked' ? 'fail' : 'warn',
          decisionId: d.decisionId ?? null,
          featureId: d.featureId ?? null,
          runId: d.runId ?? null,
          level: attentionLevel(d),
        })),
      },
      {
        key: 'inProgress',
        title: 'In progress',
        count: inProgress.length,
        emptyText: 'Nothing is running.',
        items: inProgress,
      },
      {
        key: 'recentlyLanded',
        title: 'Recently landed',
        count: (snapshot.recentlyLanded || []).length,
        emptyText: 'Nothing yet.',
        items: (snapshot.recentlyLanded || []).map((f) => ({
          id: f.featureId,
          kind: 'feature',
          label: `${f.featureId}: ${f.title}`,
          sub: f.pr?.url ? 'merged · pull request' : 'merged',
          dot: 'done',
          reportRel: f.reportRel ?? null,
          pr: f.pr ?? null,
        })),
      },
      {
        key: 'upNext',
        title: 'Up next',
        count: (snapshot.upNext || []).length,
        emptyText: 'Nothing queued.',
        items: (snapshot.upNext || []).map((f) => ({
          id: f.featureId,
          kind: 'feature',
          label: `${f.featureId}: ${f.title}`,
          sub: f.blockedBy?.length ? `waiting on ${f.blockedBy.join(', ')}` : 'ready',
          dot: 'pending',
        })),
      },
    ],
  };
}

/** Which runs deserve a tab badge, and at what level. */
function attentionByRun(snapshot) {
  const out = new Map();
  for (const item of snapshot?.needsDecision || []) {
    if (item.runId) out.set(item.runId, attentionLevel(item));
  }
  for (const run of snapshot?.inProgress || []) {
    if (run.state === 'dead' || run.state === 'stale') out.set(run.runId, 'blocked');
  }
  return out;
}


// ===== api.mjs =====
// Talking to the dashboard server.
//
// Every call is scoped to a project, because one dashboard serves every repo on
// the machine. Errors are returned rather than thrown: a failed poll should
// leave the last good view on screen with a note, not blank the page.

function createApi(projectRef) {
  const q = (params = {}) => {
    const search = new URLSearchParams({ project: projectRef(), ...params });
    for (const [k, v] of [...search]) if (v === undefined || v === null || v === '') search.delete(k);
    return search.toString();
  };

  async function get(path, params) {
    const res = await fetch(`${path}?${q(params)}`, { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error(`${path} failed (${res.status})`);
    return res.json();
  }

  async function post(path, body = {}) {
    const res = await fetch(`${path}?${q()}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `${path} failed (${res.status})`);
    return data;
  }

  return {
    projects: () => get('/api/projects'),
    state: (run) => get('/api/state', run ? { run } : {}),
    runs: () => get('/api/runs'),
    pool: () => get('/api/pool'),
    decisions: (status) => get('/api/decisions', status ? { status } : {}),
    artifact: (name, run) => get('/api/artifact', { name, ...(run ? { run } : {}) }),
    log: (stage, run, params = {}) => get('/api/log', { stage, ...(run ? { run } : {}), ...params }),
    reportUrl: (params) => `/api/report?${q(params)}`,

    answerDecision: (decisionId, answer) => post('/api/decisions/answer', { decisionId, answer }),
    approveMerge: (featureId, note) => post('/api/merge/approve', { featureId, note }),
    requestChanges: (featureId, text) => post('/api/merge/request-changes', { featureId, text }),
    followup: (stage, text, run) => post('/api/followup', { stage, text, run }),
    pausePool: (why) => post('/api/pool/pause', { why }),
    resumePool: () => post('/api/pool/resume', {}),
    continueRun: (approve) => post('/api/continue', approve ? { approve: true } : {}),
    cancelRun: () => post('/api/cancel', {}),
    resumeRun: () => post('/api/resume', {}),
    extendRun: (cycles) => post('/api/extend', { cycles }),
  };
}


// ===== main.mjs =====
// The control room.
//
// One dashboard watches a whole pool: a roadmap of features, several workers
// building in parallel, and the decisions waiting on a person. The sidebar
// answers "what needs me / what is happening / what landed / what is next";
// tabs hold whatever you opened, each keeping its own place.
//
// Design rules worth stating, because they are easy to break later:
//  - Only the active tab re-renders on an update. A background run finishing
//    must never move the view someone is reading.
//  - Nothing is dressed up. A stuck run looks stuck; a failed feature says so.
//  - No feature is hidden when there is no pool: a plain single-run project
//    gets the same tabs with a runs list instead of a roadmap.





const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const child of [].concat(children)) if (child) node.append(child);
  return node;
};

const state = {
  project: new URLSearchParams(location.search).get('project') || '',
  projects: [],
  pool: null,
  runs: [],
  status: null,
  sse: null,
  seq: 0,
};

const api = createApi(() => state.project);
const tabs = createTabStore();

// ---- shell ----------------------------------------------------------------

function toast(message) {
  const node = $('toast');
  node.textContent = message;
  node.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { node.hidden = true; }, 3200);
}

function setTheme(next) {
  const root = document.documentElement;
  if (next === 'system') delete root.dataset.theme;
  else root.dataset.theme = next;
  try { localStorage.setItem('orchestrator-theme', next); } catch {}
}

function currentTheme() {
  return document.documentElement.dataset.theme || 'system';
}

// ---- sidebar --------------------------------------------------------------

function renderSidebar() {
  const side = $('side');
  side.replaceChildren();
  const tree = buildTree(state.pool?.snapshot ?? null);

  if (!tree.enabled) {
    // Single-run project: the runs list stands in for a roadmap.
    side.append(sectionNode({
      key: 'runs', title: 'Runs', count: state.runs.length, emptyText: 'No runs yet.',
      items: state.runs.map((r) => ({
        id: r.id, kind: 'run',
        label: r.task ? String(r.task).slice(0, 60) : r.id,
        sub: [r.overall, r.verdict].filter(Boolean).join(' · '),
        dot: r.overall === 'done' ? 'done' : r.overall === 'halted' ? 'fail' : 'run',
      })),
    }));
    return renderSideFoot(tree);
  }

  for (const section of tree.sections) side.append(sectionNode(section));
  renderSideFoot(tree);
}

function sectionNode(section) {
  const title = el('div', { class: `side-title${section.key === 'needsDecision' && section.count ? ' attn' : ''}` }, [
    el('span', { text: section.title }),
    section.count ? el('span', { class: 'n', text: String(section.count) }) : null,
  ]);
  const body = section.items.length
    ? section.items.flatMap((item) => [nodeButton(item), ...(item.children || []).map((c) => nodeButton(c, true))])
    : [el('div', { class: 'side-empty', text: section.emptyText })];
  return el('div', { class: 'side-section' }, [title, ...body]);
}

function nodeButton(item, child = false) {
  return el('button', {
    class: `node${child ? ' child' : ''}`,
    title: item.warn || item.label,
    onclick: () => openFor(item),
  }, [
    el('span', { class: `dot ${item.dot}` }),
    el('span', { class: 'label' }, [
      el('b', { text: item.label }),
      item.sub || item.warn ? el('span', { text: item.warn || item.sub }) : null,
    ]),
  ]);
}

function openFor(item) {
  if (item.kind === 'run') return open({ kind: 'run', subject: item.id, title: item.label });
  if (item.kind === 'decision') {
    if (item.featureId && item.level === 'merge') return open({ kind: 'review', subject: item.runId || item.featureId, feature: item.featureId, title: `Review ${item.featureId}` });
    return open({ kind: 'decisions', title: 'Decisions' });
  }
  if (item.kind === 'feature') {
    if (item.reportRel) return open({ kind: 'report', subject: item.id, file: item.reportRel, title: `${item.id} report` });
    return open({ kind: 'feature', subject: item.id, title: item.label });
  }
}

function renderSideFoot(tree) {
  const foot = $('side-foot');
  foot.replaceChildren();
  if (tree.enabled) {
    foot.append(el('button', {
      class: 'btn ghost', text: tree.paused ? 'Resume pool' : 'Pause pool',
      onclick: async () => {
        try {
          await (tree.paused ? api.resumePool() : api.pausePool('paused from the dashboard'));
          toast(tree.paused ? 'Pool resumed.' : 'Pool paused; running workers finish their current stage.');
          refresh();
        } catch (err) { toast(err.message); }
      },
    }));
  }
  foot.append(el('button', { class: 'btn ghost', text: 'Decisions', onclick: () => open({ kind: 'decisions', title: 'Decisions' }) }));
}

// ---- tabs -----------------------------------------------------------------

function open(spec) {
  tabs.open(spec);
  syncUrl();
  render();
}

function renderTabs() {
  const strip = $('tabs');
  strip.replaceChildren();
  for (const tab of tabs.list()) {
    const selected = tab.id === tabs.activeId();
    strip.append(el('button', {
      class: 'tab', role: 'tab', 'aria-selected': String(selected),
      onclick: () => { tabs.activate(tab.id); syncUrl(); render(); },
    }, [
      tab.attention ? el('span', { class: `badge ${tab.attention}` }) : null,
      el('span', { class: 't', text: tab.title || tab.id }),
      tab.pinned ? null : el('span', {
        class: 'x', text: '×', title: 'Close',
        onclick: (e) => { e.stopPropagation(); tabs.close(tab.id); syncUrl(); render(); },
      }),
    ]));
  }
}

function syncUrl() {
  const search = state.project ? `?project=${encodeURIComponent(state.project)}` : '';
  history.replaceState(null, '', `${location.pathname}${search}#${tabs.serialize()}`);
}

// ---- panels ---------------------------------------------------------------

function render() {
  renderTabs();
  const host = $('panels');
  host.replaceChildren();
  const tab = tabs.active();
  if (!tab) return host.append(el('div', { class: 'panel' }, el('div', { class: 'empty', text: 'Nothing open.' })));
  const panel = el('div', { class: 'panel' });
  const wrap = el('div', { class: 'wrap' });
  panel.append(wrap);
  host.append(panel);
  const view = VIEWS[tab.kind] || VIEWS.home;
  view(wrap, tab);
  panel.scrollTop = tab.scrollTop || 0;
  panel.addEventListener('scroll', () => { tab.scrollTop = panel.scrollTop; }, { passive: true });
}

const VIEWS = {
  home: viewHome,
  run: viewRun,
  feature: viewFeature,
  review: viewReview,
  decisions: viewDecisions,
  report: viewReport,
};

function viewHome(wrap) {
  const snap = state.pool?.snapshot;
  if (!snap) {
    wrap.append(el('h1', { text: 'Orchestrator' }));
    wrap.append(el('p', { class: 'sub', text: 'No roadmap is running in this project. Open a run from the sidebar, or start one with the orchestrate command.' }));
    return;
  }
  wrap.append(el('h1', { text: snap.roadmap?.title || 'Pool' }));
  wrap.append(el('p', {
    class: 'sub',
    text: `${snap.counts.inProgress} run(s) in progress · ${snap.counts.decisions} waiting on you · ${snap.counts.landed} landed · ${snap.counts.queued} queued`,
  }));

  if (!snap.supervisor.alive) {
    wrap.append(el('div', { class: 'banner fail', html: 'The supervisor is not running, so nothing will advance. Start it with <code>bash .pipeline/orchestrate.sh pool start</code>.' }));
  } else if (snap.supervisor.paused) {
    wrap.append(el('div', { class: 'banner warn', text: 'The pool is paused. Running workers will finish their current stage and stop there.' }));
  }

  for (const skill of snap.skills || []) {
    if (skill.status === 'verified') continue;
    wrap.append(el('div', {
      class: 'banner warn',
      html: `Skill <code>${esc(skill.name)}</code> is not in use (${esc(skill.status)}). Run <code>node pipeline/skills.mjs pin ${esc(skill.name)}</code> after reviewing it.`,
    }));
  }

  if (snap.needsDecision.length) {
    wrap.append(el('h2', { text: 'Needs your decision' }));
    for (const item of snap.needsDecision) wrap.append(decisionCard(item));
  }

  wrap.append(el('h2', { text: 'Roadmap' }));
  for (const feature of snap.roadmap?.features || []) {
    wrap.append(el('div', { class: 'card' }, [
      el('h4', { text: `${feature.id}: ${feature.title}` }),
      el('div', { class: 'meta', text: featureLabel(feature.status) + (feature.pr?.url ? ' · pull request open' : '') }),
      el('div', { class: 'row', style: 'margin-top:8px' }, [
        feature.reportRel ? el('button', { class: 'btn ghost', text: 'Report', onclick: () => open({ kind: 'report', subject: feature.id, file: feature.reportRel, title: `${feature.id} report` }) }) : null,
        feature.runIds?.length ? el('button', { class: 'btn ghost', text: 'Runs', onclick: () => open({ kind: 'feature', subject: feature.id, title: `${feature.id}: ${feature.title}` }) }) : null,
      ]),
    ]));
  }
}

function decisionCard(item) {
  const answer = el('textarea', { placeholder: item.options?.length ? `One of: ${item.options.join(', ')}` : 'Your answer' });
  const actions = el('div', { class: 'row', style: 'margin-top:8px' });

  for (const option of item.options || []) {
    actions.append(el('button', {
      class: 'btn ghost', text: option,
      onclick: () => { answer.value = option; },
    }));
  }
  if (item.decisionId) {
    actions.append(el('button', {
      class: 'btn', text: 'Answer',
      onclick: async () => {
        if (!answer.value.trim()) return toast('Write an answer first.');
        try {
          await api.answerDecision(item.decisionId, answer.value.trim());
          toast('Recorded. The run has been asked to continue.');
          refresh();
        } catch (err) { toast(err.message); }
      },
    }));
  }
  if (item.runId) actions.append(el('button', { class: 'btn ghost', text: 'Open run', onclick: () => open({ kind: 'run', subject: item.runId, title: item.runId }) }));

  return el('div', { class: 'card' }, [
    el('h4', { text: item.question }),
    el('div', { class: 'meta', text: [item.featureId, item.runId, item.kind].filter(Boolean).join(' · ') }),
    item.recommended ? el('div', { class: 'meta', text: `Recommended: ${item.recommended}` }) : null,
    ...(item.artifacts || []).map((a) => el('div', { class: 'meta', html: `<code>${esc(a)}</code>` })),
    item.decisionId ? answer : el('div', { class: 'meta', text: 'This needs action elsewhere — see the run.' }),
    actions,
  ]);
}

function viewDecisions(wrap) {
  wrap.append(el('h1', { text: 'Decisions' }));
  const items = state.pool?.snapshot?.needsDecision || [];
  if (!items.length) return wrap.append(el('div', { class: 'empty', text: 'Nothing is waiting for you.' }));
  wrap.append(el('p', { class: 'sub', text: 'Every open question, oldest first. Answering one lets its run continue.' }));
  for (const item of items) wrap.append(decisionCard(item));
}

function viewFeature(wrap, tab) {
  const feature = state.pool?.snapshot?.roadmap?.features?.find((f) => f.id === tab.subject);
  if (!feature) return wrap.append(el('div', { class: 'empty', text: 'That feature is no longer in the roadmap.' }));
  wrap.append(el('h1', { text: `${feature.id}: ${feature.title}` }));
  wrap.append(el('p', { class: 'sub', text: featureLabel(feature.status) }));
  if (feature.pr?.url) wrap.append(el('p', {}, el('a', { href: feature.pr.url, text: feature.pr.url, target: '_blank', rel: 'noreferrer' })));
  wrap.append(el('h2', { text: 'Runs' }));
  const runs = (state.pool?.snapshot?.inProgress || []).filter((r) => r.featureId === feature.id);
  if (!runs.length) wrap.append(el('div', { class: 'empty', text: 'No runs are active for this feature.' }));
  for (const run of runs) {
    wrap.append(el('div', { class: 'card' }, [
      el('h4', { text: run.ticketId || run.kind }),
      el('div', { class: 'meta', text: `${run.state}${run.stage ? ` · ${run.stage}` : ''}` }),
      el('button', { class: 'btn ghost', text: 'Open', onclick: () => open({ kind: 'run', subject: run.runId, title: run.ticketId || run.runId }) }),
    ]));
  }
}

// ---- run view -------------------------------------------------------------

// Which artifact each stage is contracted to produce, so a run tab shows the
// output of the stage you are looking at rather than everything at once.
const STAGE_ARTIFACT = {
  planner: 'specs.md',
  designer: 'design.md',
  coder: 'changes.md',
  tester: 'test_suite.md',
  reviewer: 'review_report.md',
  handoff: 'handoff.md',
  reporter: 'reporter.md',
};

async function viewRun(wrap, tab) {
  wrap.append(el('h1', { text: tab.title || tab.subject }));
  const sub = el('p', { class: 'sub', text: 'Loading…' });
  wrap.append(sub);
  const bar = el('div', { class: 'stagebar' });
  const body = el('div');
  wrap.append(bar, body);

  let data;
  try { data = await api.state(tab.subject); } catch (err) { sub.textContent = err.message; return; }
  if (tabs.activeId() !== tab.id) return; // the reader moved on while we fetched

  const status = data.status || {};
  sub.textContent = [status.overall, status.verdict, status.branch].filter(Boolean).join(' · ') || 'no state recorded';

  const stages = (status.stages || []).filter((s) => s.status !== 'skipped');
  const active = tab.stage || stages.find((s) => s.status === 'running')?.name || stages[stages.length - 1]?.name || 'planner';
  for (const stage of stages) {
    bar.append(el('button', {
      class: 'stagebtn', 'aria-current': stage.name === active ? 'step' : null,
      onclick: () => { tab.stage = stage.name; render(); },
    }, [
      el('span', { class: `dot ${stage.status === 'passed' ? 'done' : stage.status === 'running' ? 'run' : stage.status === 'failed' ? 'fail' : 'pending'}` }),
      el('span', { text: stage.name }),
    ]));
  }

  if (status.haltReason) {
    body.append(el('div', { class: 'banner fail', text: `Halted: ${status.haltReason}. ${status.stages?.find((s) => s.detail)?.detail || ''}` }));
  }
  if (status.overall === 'awaiting_plan_approval') {
    body.append(el('div', { class: 'banner warn', text: 'This run is waiting for its plan to be approved. Answer it in Decisions, or read the specification below first.' }));
  }

  // Activity, rebuilt from the events the engine recorded for this stage.
  const events = (data.events || {})[active] || [];
  body.append(el('h3', { text: `${active} activity` }));
  if (!events.length) body.append(el('div', { class: 'empty', text: 'Nothing recorded for this stage yet.' }));
  const feed = el('div', { class: 'feed' });
  for (const ev of events.slice(-120)) feed.append(eventBlock(ev));
  body.append(feed);

  // The artifact this stage produced. `data.artifacts` is a list of file names
  // that exist and are non-empty; content is fetched separately.
  const wanted = STAGE_ARTIFACT[active];
  if (wanted && (data.artifacts || []).includes(wanted)) {
    body.append(el('h3', { text: wanted }));
    const card = el('div', { class: 'card', text: 'Loading…' });
    body.append(card);
    api.artifact(wanted, tab.subject)
      .then((a) => { card.innerHTML = renderMd(a.content || ''); })
      .catch(() => { card.textContent = 'Could not read this artifact.'; });
  }

  body.append(el('h3', { text: 'Log' }));
  const logBox = el('pre', {}, el('code', { text: 'Loading…' }));
  body.append(logBox);
  api.log(active, tab.subject).then((log) => {
    logBox.replaceChildren(el('code', { text: log.text || 'No log for this stage.' }));
  }).catch(() => logBox.replaceChildren(el('code', { text: 'No log for this stage.' })));

  // A note for the agent working this stage.
  const note = el('textarea', { placeholder: `Note for the ${active} stage — it is picked up on the next cycle.` });
  body.append(el('h3', { text: 'Send a note' }), note, el('div', { class: 'row', style: 'margin-top:8px' }, [
    el('button', {
      class: 'btn', text: 'Send',
      onclick: async () => {
        if (!note.value.trim()) return toast('Write a note first.');
        try { await api.followup(active, note.value.trim(), tab.subject); note.value = ''; toast('Queued for the agent.'); }
        catch (err) { toast(err.message); }
      },
    }),
    el('button', { class: 'btn ghost', text: 'Review this run', onclick: () => open({ kind: 'review', subject: tab.subject, title: `Review ${tab.title || tab.subject}` }) }),
  ]));
}

function eventBlock(ev) {
  if (ev.type === 'checks_start') return el('div', { class: 'divider', text: 'verification' });
  if (ev.type === 'check_end') return el('div', { class: 'block sys', text: `${ev.ok ? '✓' : '✗'} ${ev.check}` });
  if (ev.type === 'agent_start') return el('div', { class: 'divider', text: ev.cycle > 1 ? `cycle ${ev.cycle}` : 'started' });
  if (ev.type === 'followup_applied') return el('div', { class: 'block sys', text: 'A note from you was applied here.' });
  if (ev.kind === 'err') return el('div', { class: 'block err', text: ev.text || '' });
  if (ev.kind === 'tool') return el('div', { class: 'block sys', text: `${ev.tool || 'tool'}${ev.file ? ` · ${ev.file}` : ''}${ev.cmd ? ` · ${ev.cmd}` : ''}` });
  if (ev.kind === 'sys') return el('div', { class: 'block sys', text: ev.text || '' });
  return el('div', { class: 'block', html: renderMd(ev.text || '') });
}

// ---- review view ----------------------------------------------------------

async function viewReview(wrap, tab) {
  wrap.append(el('h1', { text: tab.title || `Review ${tab.subject}` }));
  const sub = el('p', { class: 'sub', text: 'Loading…' });
  wrap.append(sub);
  const body = el('div');
  wrap.append(body);

  let data;
  try { data = await api.state(tab.subject); } catch (err) { sub.textContent = err.message; return; }
  if (tabs.activeId() !== tab.id) return;
  const status = data.status || {};
  const feature = tab.feature || status.featureId;
  sub.textContent = [status.verdict ? `verdict ${status.verdict}` : null, feature, status.branch].filter(Boolean).join(' · ');

  const present = new Set(data.artifacts || []);
  // Every review lens the panel produced, then the tests, then the diff — the
  // order someone actually reviews in: verdict first, evidence after.
  const sections = [
    ['review_report.md', 'Review'],
    ['review_correctness.md', 'Correctness'],
    ['review_security.md', 'Security'],
    ['review_architecture.md', 'Architecture'],
    ['test_suite.md', 'Tests'],
  ].filter(([name]) => present.has(name));

  for (const [name, heading] of sections) {
    body.append(el('h2', { text: heading }));
    const card = el('div', { class: 'card', text: 'Loading…' });
    body.append(card);
    api.artifact(name, tab.subject)
      .then((a) => { card.innerHTML = renderMd(a.content || ''); })
      .catch(() => { card.textContent = `Could not read ${name}.`; });
  }
  if (present.has('diff.patch')) {
    body.append(el('h2', { text: 'Diff' }));
    const holder = el('div', { text: 'Loading…' });
    body.append(holder);
    api.artifact('diff.patch', tab.subject)
      .then((a) => { holder.innerHTML = renderDiff(a.content || ''); })
      .catch(() => { holder.textContent = 'Could not read the diff.'; });
  }
  if (!sections.length && !present.has('diff.patch')) {
    body.append(el('div', { class: 'empty', text: 'This run has no review to show yet.' }));
  }

  // The decision this review exists to support.
  const pending = (state.pool?.snapshot?.needsDecision || []).find((d) => d.featureId === feature && d.kind === 'merge-approval');
  if (feature) {
    const changes = el('textarea', { placeholder: 'What should change? This goes to the coder and reopens review.' });
    body.append(el('h2', { text: 'Decision' }));
    body.append(el('div', { class: 'card' }, [
      el('div', { class: 'meta', text: pending ? pending.question : `Feature ${feature}` }),
      changes,
      el('div', { class: 'row', style: 'margin-top:8px' }, [
        el('button', {
          class: 'btn', text: 'Approve merge', disabled: !pending,
          onclick: async () => {
            try { await api.approveMerge(feature); toast('Approved. The supervisor verifies it is still mergeable before merging.'); refresh(); }
            catch (err) { toast(err.message); }
          },
        }),
        el('button', {
          class: 'btn ghost', text: 'Request changes',
          onclick: async () => {
            if (!changes.value.trim()) return toast('Say what should change first.');
            try { await api.requestChanges(feature, changes.value.trim()); toast('Sent to the coder.'); refresh(); }
            catch (err) { toast(err.message); }
          },
        }),
      ]),
      pending ? null : el('div', { class: 'meta', style: 'margin-top:6px', text: 'Approving is available once the feature is reviewed and waiting for you.' }),
    ]));
  }
}

// ---- report view ----------------------------------------------------------

function viewReport(wrap, tab) {
  wrap.append(el('h1', { text: tab.title || 'Report' }));
  const params = tab.file?.startsWith('runs/')
    // A roadmap records a repo-relative path; the endpoint wants run + file.
    ? { run: tab.file.split('/')[1], file: tab.file.split('/').slice(3).join('/') }
    : { feature: tab.subject, file: tab.file || 'work-done.html' };
  const src = api.reportUrl(params);
  wrap.append(el('p', { class: 'sub' }, el('a', { href: src, target: '_blank', rel: 'noreferrer', text: 'Open in a new tab' })));
  // Sandboxed without same-origin: a report may run its own scripts to be
  // interactive, but can never read this page or call the API.
  wrap.append(el('iframe', { class: 'report', src, sandbox: 'allow-scripts', referrerpolicy: 'no-referrer', title: 'Work-done report' }));
}

// ---- data -----------------------------------------------------------------

async function refresh() {
  try {
    const [pool, runs] = await Promise.all([
      api.pool().catch(() => ({ enabled: false })),
      api.runs().catch(() => ({ runs: [] })),
    ]);
    state.pool = pool.enabled ? pool : null;
    state.runs = runs.runs || [];
  } catch { /* keep the last good view rather than blanking the page */ }

  // Badge the tabs whose runs need someone, without stealing focus.
  const attention = attentionByRun(state.pool?.snapshot ?? null);
  for (const [runId, level] of attention) tabs.markAttention(runId, level, { seq: ++state.seq });

  const decisions = state.pool?.snapshot?.counts?.decisions ?? 0;
  document.title = decisions ? `(${decisions}) Orchestrator` : 'Orchestrator';
  const poolChip = $('pool-state');
  if (state.pool) {
    const s = state.pool.snapshot.supervisor;
    poolChip.hidden = false;
    poolChip.textContent = !s.alive ? 'supervisor stopped' : s.paused ? 'paused' : `${state.pool.snapshot.counts.inProgress} running`;
    poolChip.className = `chip ${!s.alive ? 'fail' : s.paused ? 'warn' : ''}`;
  } else poolChip.hidden = true;

  const totals = $('totals');
  const cost = state.pool?.snapshot?.totals?.costUsd;
  if (cost) { totals.hidden = false; totals.textContent = `$${cost.toFixed(2)}`; } else totals.hidden = true;

  $('live-dot').className = `dot${state.pool?.snapshot?.supervisor?.alive ? '' : ' idle'}`;
  renderSidebar();
  render();
}

function connect() {
  if (state.sse) state.sse.close();
  const source = new EventSource(`/events?project=${encodeURIComponent(state.project)}`);
  source.onmessage = (message) => {
    try {
      const data = JSON.parse(message.data);
      if (data.type === 'change') refresh();
    } catch { /* a malformed frame is not worth breaking the page over */ }
  };
  source.onerror = () => { /* EventSource retries on its own */ };
  state.sse = source;
}

async function initProjects() {
  try {
    const { projects } = await api.projects();
    state.projects = projects || [];
    if (!state.project && state.projects.length) state.project = state.projects[0].repoRoot;
    const select = $('project');
    select.replaceChildren();
    for (const project of state.projects) {
      select.append(el('option', { value: project.repoRoot, text: project.name || project.repoRoot, selected: project.repoRoot === state.project }));
    }
    select.hidden = state.projects.length < 2;
    select.onchange = () => { state.project = select.value; connect(); refresh(); };
  } catch { $('project').hidden = true; }
}

// ---- keyboard -------------------------------------------------------------

const SHORTCUTS = [
  ['[ / ]', 'previous / next tab'],
  ['x', 'close tab'],
  ['g h', 'home'],
  ['g d', 'decisions'],
  ['?', 'this list'],
];

function onKey(event) {
  const target = event.target;
  if (target && /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName)) return;
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.key === '[') { tabs.move(-1); syncUrl(); render(); }
  else if (event.key === ']') { tabs.move(1); syncUrl(); render(); }
  else if (event.key === 'x') { const t = tabs.active(); if (t) { tabs.close(t.id); syncUrl(); render(); } }
  else if (event.key === '?') showHelp();
  else if (event.key === 'g') {
    const next = (e2) => {
      document.removeEventListener('keydown', next, true);
      if (e2.key === 'h') open({ kind: 'home', title: 'Overview' });
      if (e2.key === 'd') open({ kind: 'decisions', title: 'Decisions' });
    };
    document.addEventListener('keydown', next, true);
  }
}

function showHelp() {
  toast(SHORTCUTS.map(([k, v]) => `${k}: ${v}`).join('   ·   '));
}

// ---- boot -----------------------------------------------------------------

function initResize() {
  const handle = $('resize');
  let dragging = false;
  handle.addEventListener('mousedown', () => { dragging = true; document.body.style.userSelect = 'none'; });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = '';
    try { localStorage.setItem('orchestrator-sidebar-w', String(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-w'), 10))); } catch {}
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const width = Math.max(220, Math.min(440, e.clientX));
    document.documentElement.style.setProperty('--sidebar-w', `${width}px`);
  });
}

async function boot() {
  $('theme').onclick = () => {
    const order = ['system', 'light', 'dark'];
    setTheme(order[(order.indexOf(currentTheme()) + 1) % order.length]);
  };
  $('help').onclick = showHelp;
  document.addEventListener('keydown', onKey, true);
  initResize();

  await initProjects();
  tabs.open({ kind: 'home', title: 'Overview', pinned: true });
  if (location.hash.includes('tabs=')) {
    // A restored tab has no live data yet, so its label comes from what it is.
    tabs.restore(location.hash, {
      titleFor: (spec) => (spec.kind === 'review' ? `Review ${spec.subject}`
        : spec.kind === 'report' ? `${spec.subject} report`
          : spec.subject || (spec.kind === 'home' ? 'Overview' : spec.kind)),
    });
    if (!tabs.list().length) tabs.open({ kind: 'home', title: 'Overview', pinned: true });
  }
  connect();
  await refresh();
  // A slow fallback: the watcher is the primary signal, this only covers a
  // dropped stream.
  setInterval(refresh, 15000);
}

boot();

</script>
